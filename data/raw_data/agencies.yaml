    type: disruption
    event: >-
      Trump fires Rohit Chopra, the independent director of the CFPB. The deputy director of the CFPB,
      Zixta Martinez, assumes the role of acting director.
    project:
    - elimination
    - deregulation
    source: https://www.npr.org/2025/02/01/nx-s1-5254186/cfpb-consumer-financial-protection-cfpb-trump-chopra
    agency: CFPB
