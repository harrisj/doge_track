    information at Social Security and the IRS ran into legal opposition. DOGE claims this is needed for
    the administration's anti-immigration efforts, but it's not hard to imagine many other shady scenarios
    for this data. Around the middle of April, DOGE added a third staffer at the agency who is piloting
    effort to use a Large Language Model (LLM) to identify housing regulations to repeal.
