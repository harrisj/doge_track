- name: Office of Personnel Management
  id: OPM
  short_name: OPM
  slug: opm
  page_slug: self
  blurb: |-
    One of the ways in which DOGE surprised everybody was how it turned a relatively sleepy agency into a weapon against the entire government bureaucracy. Created by law in 1978, OPM's main role before now was to standardize government policies around personnel and to offer shared services for human capital like the federal health plans. It also tracks all the paperwork around hiring, promotions, changes and retirement. And so, for most federal staff, their main interactions with OPM were receiving paperwork they were hired, fired or retired; or picking a health plan; or looking at the rules around various practices. But, all the other aspects of human resources were handled by their own agencies. Federal staff are hired to their specific agencies, their performance rankings are defined by their agency, they're promoted by their agencies, they're paid by their agencies, they follow the HR policies of their agencies. OPM provides the guidance, but it's the agencies that implement it.

    This is why OPM's turn towards the dark side has been so confounding. Very early on, DOGE concentrated a large number of staff within OPM to capture control of the centralized databases and install a new email server to send/receive messages from every federal worker. The acting director was forced out and replaced by Charles Ezell, who then let DOGE wall off an area and keep out permanent agency staff. DOGE also brought in a slew of HR executives from startups who seemingly expected the agency to work for the entire federal government in the same way that HR operates within a single company. And so, they started acting like OPM had more centralized authority: ordering workers to the "five things" email; blasting [commands to human capital officers at other agencies](https://www.chcoc.gov/transmittals); asking for lists of workers so they could command agencies to fire probationary workers and short-cut established procedures for reductions in force. OPM used to be deliberative and formal with its rulemaking - the new OPM was fond of sending out memos to all agencies on Wednesdays demanding a response by Friday. None of this was normal; some of it was [probably illegal](https://www.npr.org/2025/03/13/nx-s1-5325959/federal-employees-court-firing). And the breach in trust has been irrevocable.
  doge_base: true
  events:
  - date: 2025-01-(16)~
    type: action
    event: >-
      According to his later sworn testimony, Noah Peters meets with Keenan Kmiec to outline his plan
      on how to use administrative leave to sideline federal employees from being able to do their work
      and counter or monitor DOGE's activities at their agencies.
    project:
    - personnel
    - impunity
    fuzz: Date is approximate in deposition
    named:
    - Noah Peters
    - Keenan Kmiec
    source: https://storage.courtlistener.com/recap/gov.uscourts.cand.444883/gov.uscourts.cand.444883.188.1.pdf
    case_no: 3:25-cv-01780
    agency: OPM
    id: KLhbExN5
