  blurb: >-
    DOGE's involvement at HUD has ostensibly been focused on fraud and waste rather than IT modernization.
    At the start, the DOGE staff at the agency focused on cancelling contracts, especially if it could
    find opportunities to eliminate those focused on DEI or other initiatives to restore equity. There
    have also been efforts to use highly sensitive HUD databases as a way to get access to extremely private
