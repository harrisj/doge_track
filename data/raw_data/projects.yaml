# yaml-language-server: $schema=../schemas/project-file.json
---
- id: "ai"
  title: Artificial Intelligence
  summary: >-
      The Trump Administration has been very aggressive about promoting the use of
      AI within the federal government. DOGE staff have often been the teams
      implementing these within agencies, sometimes evading privacy and security
      rules in the process.
  label_text: AI
  path: /projects/ai

- id: "dei"
  summary: >-
      DOGE has been involved in work to eliminate "pro-DEI activities, content and
      expenditures at government agencies. This has included activities like
      scrubbing pages from websites and cancelling grants that match certain
      keywords.
  title: Anti-DEI Initiatives
  label_text: DEI
  path: /projects/dei

- id: "deregulation"
  summary: >-
      The Trump Adminstration has set a goal of removing 50% of all federal
      regulations, and DOGE has been involved in technical efforts using AI to
      identify regulations that it feels are not statutorily justified and craft
      new text for rules.
  title: Radical Deregulation
  label_text: Regs
  path: /projects/deregulation

- id: "elimination"
  summary: >-
      The Trump Administration has repeatedly targeted both large agencies like
      USAID and the CFPB as well as smaller independent agencies for total
      destruction. DOGE staff have served as the wreckers driving this, with some
      staffers repeatedly involved with infiltrating and eliminating agencies.
  title: Eliminating Agencies
  label_text: Elimination
  path: /projects/elimination

- id: "fraud"
  summary: >-
      Since its start, DOGE has been scouring agencies for evidence of vast "viral
      waste" and fraud in federal operations and expenditures. Many of these
      examples have turned out to be DOGE not understanding the complexities of
      government data, but DOGE teams continue to search in places like Social
      Security or the Treasury for fraud.
  title: Looking for Viral Waste and Fraud
  label_text: Fraud
  path: /projects/viral-waste

- id: "immigration"
  summary: >-
      Perhaps the most ominous project of DOGE has been their effort to create a
      large system that aggregates data from multiple agencies like the IRS, CMS
      and Social Security Administration to build tools for ICE to indentify
      immigrants for arrest and deportation. This work has also involved an effort
      to collect data about voting registration to support the administration's
      claim that millions of immigrants have illegally voted.
  title: Anti-immigration Technology
  label_text: Immigration
  path: /projects/immigration

- id: "spending"
  summary: >-
      Since the start, the Trump Administration and OMB head Russell Vought have
      sought to prevent the government from distributing grants or spending funds
      that have been appropriated by Congress. This is called impoundment and DOGE
      has often been instrumental in seizing control of systems to shut down
      spending within agencies.
  title: Blocking Grants and Appropriated Funds
  label_text: Spending
  path: /projects/spending-control

- id: "modernization"
  summary: >-
      The executive order that created DOGE stated that its purpose would be "IT
      Modernization," but this has often been just a mere pretext for DOGE's
      wreckers to enter an agency in order to fire staff and shut down all
      spending. However, there have been a few IT Modernization projects. For
      instance, DOGE has been involved in moving an OPM project to digitize
      retirement applications forward. More recently, the National Design Studio
      has been focused on redesigning federal websites (and launching many of its
      own) and OPM is hoping a new Tech Force initiative will be able to replace
      all the internal technical talent lost when DOGE eliminated 18F and much of
      USDS.
  title: IT Modernization
  label_text: Modernization
  path: /projects/it-modernization

- id: "impunity"
  summary: >-
      Citing the Unitary Executive Theory, the Trump Administration has been very
      aggressive about eliminating existing government organizations that provide
      oversight over the executive branch and within agencies. DOGE has sometimes
      been involved in technical efforts to evade oversight by gaining superuser
      access to systems and bypassing security controls.
  title: Evading Oversight
  label_text: Impunity
  path: /projects/impunity

- id: "personnel"
  summary: >-
      In several executive order, the Trump Administration has sought to
      dramatically reduce the number of people who work for the federal
      government, and DOGE has been involved in practically every effort related
      to that. DOGE staff conceived and executed plans to fire probationary
      employees. They implemented the famous "five things" email. They swept into
      small and large agencies to lock people out of their systems and buildings
      even. They were even given veto power over hiring decisions across the
      entire executive branch.
  label_text: Personnel
  title: Attacking Government Personnel
  path: /projects/anit-personnel
