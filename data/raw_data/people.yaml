- name: Elon Musk
  sort_name: Musk
  slug: elon-musk
  skill: executive
  category: leadership
  govt_exit_type: resigned
  govt_exit_date: 2025-05-28
  govt_exit_truth: reported
  blurb: >-
    Elon Musk was certainly the face and inspiration of DOGE, but it will likely be some time before we
    know the exact nature of his activities there. According to the official record, he was merely a humble
    advisor and DOGE was actually run by Amy Gleason. In actuality, it appears that Musk was setting the
    high-level direction of DOGE, with the daily operations conducted by deputies like Steve Davis, Anthony
    Armstrong or even Baris Akis. Musk was particularly preoccupied with finding instances of waste and
    fraud that he was certain was rampant everywhere in the government, and a lot of DOGE's early involvement
    at the Treasury and SSA was in chasing down false alarms and misinformation triggered by DOGE's poor
    understanding of data or even how the government worked. After his relationship soured with Trump,
    Musk left DOGE in late May, followed by multiple resignations of other DOGE allies leaving before
    the winds shifted. This didn't mark the end of DOGE however, and the remaining staff are largely still
    carrying forward the same mission they started with.
