- date: 2025-05-23
  type: official
  event: >-
    President Trump issues EO 14300, which orders the NRC to relax its regulatory oversight over the nuclear
    industry. It also demands that the agency must plan for a Reduction-in-Force (RIF) and realign its
    organizational priorities. Following the model used by the Trump Administration for other independent
    agencies, this is probably the prelude for DOGE to arrive at the agency.
  source: >-
    https://www.presidency.ucsb.edu/documents/executive-order-14300-ordering-the-reform-the-nuclear-regulatory-commission
  project:
  - impunity
  - personnel
  agency: NRC
  id: 6oj0XhzA

