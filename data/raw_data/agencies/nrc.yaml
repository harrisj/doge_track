- date: 2025-09-03
  type: oversight
  event: >-
    At a Senate Environment and Public Works Committee oversight hearing, Democratic members of the Nuclear
    Regulatory Commission shared that they fear they could be fired by Trump for enforcing nuclear safety
    regulations. Under questioning, the NRC chair confirmed there was a meeting where NRC was told it
    would be expected to "rubber-stamp" any reactor designs approved by the Department of Energy or Department
    of Defense. NRC Chair David Wright also testified that there were currently 7 DOGE staffers at the
    agency. One of them has had prior experience at a nuclear plant and another, Adam Blake, did not have
    an NRC supervisor.
  notable: true
  named:
  - Adam Blake
  source: https://www.eenews.net/articles/dem-nrc-members-warn-they-could-be-fired-over-safety-decisions/
