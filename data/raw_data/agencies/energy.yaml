blurb: >-
  DOGE has been involved in several efforts by the Trump Administration to "unleash American energy dominance"
  through aggressive deregulation. These started at the Department of the Interior, which regulates drilling
  and mining, but DOGE's activities at the Department of Energy have ramped up since a series of executive
  orders in late May 2025 severely diminished the independence of the Nuclear Regulatory Commission. Now,
  the NRC is supposed to rubber stamp the Department of Energy's directives, and the Department of Energy's
  directive is to reduce regulations and increase support for new nuclear energy startups.
blurb_date: 2026-03-26
