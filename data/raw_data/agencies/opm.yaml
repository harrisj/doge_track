- :date: 2025-09-12
  :type: legal
  :event: Ruling in _AFGE, AFL-CIO v. OPM_, Judge William Alsup finds that OPM's mass
    firing of probationary employees was illegal. However, he does not order that
    fired employees should be reinstated to their positions, since it has been months
    since the action and the Supreme Court would be likely to overrule. Instead, he
    has enjoined OPM from conducting similar actions in the future and ordered them
    to amend the records to note that employees were not terminated due to performance
    reasons (as the government falsely claimed in many dismissal letters).
  :notable: true
  :source: https://storage.courtlistener.com/recap/gov.uscourts.cand.444883/gov.uscourts.cand.444883.261.0.pdf
  :project: personnel
  :case_no: 3:25-cv-01780
  :agency: OPM
  :id: 5VkcKBeb
