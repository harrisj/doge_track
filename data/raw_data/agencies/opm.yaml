- :date: 2026-10-22
  :type: legal
  :event: Ruling in _AFL-CIO v. OPM_, Judge Denise Cote ruled that OPM violated federal
    laws on privacy and cybersecurity when it shared records on millions of federal
    employees with DOGE staff. She notes that at this point, even "the defendents
    barely defend its legality." The government had instead argued that the case was
    moot and any further injunction was unnecessary since DOGE's formal presence had
    almost completely waned.
  :source: https://federalnewsnetwork.com/litigation/2026/10/opm-unlawfully-let-doge-access-sensitive-federal-employee-data-judge-rules/
  :agency: OPM
  :id: 56n3aPIV
