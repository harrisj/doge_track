- date: 2025-08-03
  type: disruption
  project: immigration
  event: >-
    At least 19 states confirm that the Department of Justice has requested their voter registration lists
    and records from the 2024 and 2020 elections. At least seven states have reported that DOJ proposed
    an information-sharing agreement related to election fraud. States have not traditionally shared such
    information in the past, and there are concerns that this will be used in a fishing expedition for
    crimes or that the data will not be properly protected. This effort echoes an assertion in May by
    Antion Gracias that DOJ had asked DOGE to find “10-20 cases of alleged noncitizen voting in every
    state."
  notable: true
  source: >-
    https://www.huffpost.com/entry/justice-department-seeking-voter-election-data-states_n_688fa122e4b01495a63e53df
  agency: DOJ
  id: 1Wdw7ykw

- date: 2025-09-17
  type: legal
  event: >-
    The Department of Justice files a lawsuit against Maine and Oregon for refusing to comply with EO
    14248, an executive order that demanded that states must share unredacted voter registration lists
    with the federal government. Multiple states have refused to comply, citing both the questionable
    legality of the order as well as concerns about privacy. This data will also likely be imported into
    a DOGE project to look for voting fraud that could exaggerate the problem and cast doubts on the integrity
    of US elections
  notable: true
  project: immigration
  source: https://www.npr.org/2025/09/17/nx-s1-5544354/voter-data-lawsuit-oregon-maine
  agency: DOJ
  id: 3DBi2zCA

- date: 2025-09-25
  type: legal
  event: >-
    The DOJ files a lawsuit against five more states – Pennsylvania, Michigan, Minnesota, New York, and
    New Hampshire – that refused to turn over full and unredacted voter registration information for the
    past two elections to the DOJ. This order was mandated in EO 14248, but it's unclear that the President
    has any constitutional authority to demand such cooperation from the states. This data likely will
    be aggregated into a DOGE-created system to look in voter registration data for fraud, raising concerns
    that erroneous claims will be used to undermine elections.
  notable: true
  project: immigration
  source: >-
    https://www.inquirer.com/politics/election/pennsylvania-state-department-secretary-al-schmidt-suit-20250925.html
  agency: DOJ
  id: 4hq0C5hr

