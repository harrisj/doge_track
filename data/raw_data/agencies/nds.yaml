blurb: |-
  In the middle of summer 2025, DOGE found itself in a minor crisis. Elon Musk had left, Steve Davis had spurred a civil war within the organization, and embittered agency heads were starting to assert more power over the DOGE members embedded in their agency, including firing the ones they didn't like. In July, the _Wall Street Journal_ reported that Joe Gebbia had pitched the White House Chief of Staff Susie Wiles on a new design direction for DOGE, using "Mad Men"-style presentation boards to promote a plan for a refurbished National Parks website among others. As the article wryly noted, “Susie listened, There were no major decisions made.”

  But, it clearly worked. In late August, Trump signed EO 14338, establishing a new office of the National Design Studio within the White House, charged with defining standards for the look and functionality of federal websites. Within a few weeks, Joe Gebbia was named as the first Chief Design Officer of the NDS. Despite this new role, the NDS seems to be following theconfigs: same playbook as DOGE, with the executive order definining a similar Temporary Organization that can be used to hire Special Government Employees without them having to quit their regular work or worry about ethics declarations. Is it just DOGE 2.0?
