  project: impunity
  named:
  - John Solly
  agency: SSA
  id: 23E73xAV

- date: 2026-01-16
  type: legal
  event: >-
    In a filing in _AFL-CIO v. SSA_, the government amended several declarations that had been made in
    Leland Dudek's testimony on March 24, 2025. For starters, although DOGE access was revoked on that
    day, a member of DOGE was running queries against PII in the NUMIDENT database up to the moment. Also,
    the DOGE team at SSA sent encrypted sensitive SSA data to DOGE and the Department of Labor. A member
