- date: 2026-01-09
  type: oversight
  event: >-
    A whistleblower files a complaint alleging that a member of DOGE who left SSA in October to work for
    a private contractor had illegally retained their agency laptop and highly-sensitive data. The complaint
    alleges the unnnamed person had unredacted copies of the NUMIDENT database and the Master Death Files
    and that they boasted of "God-level" access to SSA data. The DOGE member reportedly wanted assistance
    to move data from a thumb drive to their personal equipment so they could scrub the data of personal
    identifiers and use for a company project. When informed by agency personnel that this would be highly
    illegal, the person allegedly said they would be able to receive a full presidential pardon if they
    did anything wrong. Although unnamed in the original reporting, he is revealed to be John Solly.
  notable: true
  source:
