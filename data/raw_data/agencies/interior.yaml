  :type: disruption
  :event: Two DOGE staffers – Tyler Hassen and Bryton Shang – show up an Army Corp
    of Engineers dam in California and attempt to turn on water pumps to drain more
    wate one of California's reservoirs to help fight fires in LA. This dam fed water
    to central California, far away from the LA wildfires the water was supposed to
    help.
