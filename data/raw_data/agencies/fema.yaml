- :date: 2025-08-25
  :type: disruption
  :event: More than 190 current and former FEMA employees sign their name to a public
    letter on the anniversary of Hurricane Katrina, criticizing agency leadership
    for destroying the capabilities of the agency and violating the requirements of
    the Post-Katrina Emergency Management Reform Act of 2006. While most were anonymous,
    35 employees gave their real names and were immediately placed on administrative
    leave under investigation. Due to DOGE and Kristi Noem's clamp-down on spending,
    the agency has more than $700 million in disaster funding that is still to be
    approved. In addition, a third of the agency's staff had departed by May, reducing
    the capacity and institutional wisdom of the agency to respond to disasters.
  :source: https://www.wired.com/story/fema-funding-dhs-agency-punishment/
  :agency: FEMA
  :id: 1Zguv7BS
