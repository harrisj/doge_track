  :type: disruption
  :event: Funds for FEMA's Shelter and Services Program (SSP) normally used for disaster
    relief are redirected to instead provide $608.4 million to ICE for the construction
    of an immigration detention camp in the Florida Everglades. This amount is only
    slightly smaller than the entire 2025 budget for the program, which has only $83.5
    million in reserve for this fiscal year. Possibly, DOGE aide Kyle Schutt might
    have assisted in finding money by deobligating other grants.
