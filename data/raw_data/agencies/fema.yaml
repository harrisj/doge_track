- :date: 2025-07-10
  :type: disruption
  :event: As predicted by experts, the newly created process that mandates that all
    contracts above $100,000 must be reviewed and approved by agency head Kristi Noem
    delayed the ability of FEMA to proactively respond to disastrous flash flooding
    in central Texas. For instance, FEMA could not get approval to stage Search and
    Rescue teams in the area before the disaster. The agency also was unable to approve
    additional staff for outreach and responding to calls from affected Americans.
  :project: spending
  :notable: true
  :agency:
  - FEMA
  :source: https://www.cnn.com/2025/07/09/politics/fema-texas-flood-noem
  :id: cbMdgMEs
- :date: 2025-07-22
  :type: disruption
  :event: The head of FEMA's Urban Search and Rescue unit resigns, protesting that
    the new cost controls created by DOGE and Kristi Noem is causing chaos inside
    of the agency and will lead to deadly delays during a disaster.
  :project: spending
