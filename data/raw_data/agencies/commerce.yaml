- date: 2026-08-18
  type: official
  event: >-
    The Center for Economic Studies within the Census Bureau publishes an unsigned and thinly sourced
    white paper that claims that 24,000 noncitizens voted in the 2020 election. The analysis was made
    by joining together two separate datasets and extrapolating on counts. Researchers who work with Census
    data uniformly describe the paper's methodology as deeply flawed and that the counts are likely due
    to misunderstanding the data itself. Wired later reports that one of the authors of the reports was
    Dan Sweeney, a DOGE member at EPA who is now a general counsel at Commerce as well as two staffers
    from the Trump-aligned America First Policy Institute with backgrounds in law and policy. Only one
    other staffer at Census had the actual demographer background that would be expected from reports
    of this type, but was appointed to the role only two months ago. The Trump Administration cites the
    report as justification for its election meddling.
  named:
