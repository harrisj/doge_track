- :date: 2025-03-(30)~
  :fuzz: date only given as a few days prior to termination
  :type: disruption
  :event: Nate Cavanaugh and Justin Fox gain access to the system at NEH for approving
    and administering grants. Justin Fox proceeds to look for grant descriptions containing
    words like “black,” “LGBTQ,” “Jew,” “Native,” and “immigrant" to eliminate for
    promoting DEI. He organized grants into a "Craziest Grants" and "Other Bad Grants"
    list, presumably for DOGE or the administration to use for promotional purposes.
    He also started asking ChatGPT to answer yes or no if individual grants "relate
    at all to DEI" and using that to mark grants for deletion without any further
    review.
