- :date: 2025-04-02
  :type: disruption
  :event: Approximately 1500 grantees receive grant cancellation emails sent from
    a nonstandard email address and bypassing the normal grant review process. The
    domain for the email address `Grant_Notifications@nehemail.onmicrosoft.com` suggests
    it was sent from a global admin account for Microsoft Entra, an access-control
    system used at the agency. The Acting Director of the NEH seems unaware of the
    messages. The content of the message cites an incorrect executive order as its
    justification, suggesting it was copied from an earlier email that was sent to
    IAF and USADF grantees after their DOGE takeover.
