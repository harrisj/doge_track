- :date: 2026-05-07
  :type: legal
  :event: Ruling on two separate lawsuits against the NEH that were merged into a
    single case, Judge McMahon issued a 143-page ruling declaring DOGE's grant cancellations
    at the agency were unconstitutional and caused irreparable harm to the plaintiffs.
    She ruled that the law does not allow an administration to cancel grants just
    because it disagrees with a previous administration or wants to direct funds elsewhere.
    It is unclear how this ruling might affect cases against grant cancellations at
    other agencies.
  :source: https://www.nytimes.com/2026/05/07/arts/neh-grants-lawsuit-doge.html
