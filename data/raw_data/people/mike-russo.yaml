name: Mike Russo
sort_name: Russo
slug: mike-russo
age: 67
skill: executive
blurb: >-
  Reportedly a favorite of incoming SSA commissioner Frank Bisignano, Mike Russo was named the CIO of
  Social Security in early February and immediately advocated for the expedited onboarding of Akash Bobba.
  The DOGE contingent eventually swelled to 11 engineers under his watch. In late March, he was removed
  from the CIO position and demoted to a Senior Advisor, reportedly because the Trump administration was
  displeased that he cooperated with a judge's order to revoke DOGE access to SSA systems. However, recent
  reports by the _New York Times_ claim that he is effectively acting as a co-CIO with Aram Moghaddassi
  under Frank Bisignano's leadership, so perhaps he has returned to good graces. Prior to government service,
  he was a senior executive at Shift4 Payments, which is an investor in SpaceX and a payment processor
  for Starlink.
