:blurb: Kyle Schutt is from the intersection of technologist and Republican party
  politics, having built an online fundraising platform Revv, that is frequently used
  by the GOP. He was also [linked to the development](https://xcancel.com/samwcyo/status/1889527715029557607)
  of DOGE's website [doge.gov](https://doge.gov/), which was [hacked and vandalized
  at launch because he left the database accessible to the outside world](https://www.404media.co/anyone-can-push-updates-to-the-doge-gov-website-2/),
  and his computer has been [infected with credential-stealing malware multiple times](https://cyberpress.org/stolen-credentials-from-doge-employee/).
  For its part, DOGE gave him access to a highly-sensitive database containing information
  on unaccompanied migrant children and admin credentials at CISA. His LinkedIn reports
  that he left DHS in June 2025, but he has been appointed as the new Acting CIO in
  August 2026, to replace Antoine McCord.
