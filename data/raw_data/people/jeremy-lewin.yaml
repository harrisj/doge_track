  and the remnants of a similar foreign-aid operation within the Department of State. Despite these new
  positions, he still finds time to participate in DOGE activities; recent documents from the NTEU's lawsuit
  against Russell Vought include Lewin emailing instructions to Gavin Kliger on how to conduct an attempted
  reduction-in-force at the CFPB in April.
