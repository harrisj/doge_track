blurb: >-
  Stephen Ehikian is an executive from Silicon Valley, like so many of the DOGE leaders. His specific
  background involves stints at Salesforce and an AI-related startup. Since starting at GSA, he has been
  a prime supporter of DOGE's various efforts both within the agency (staffing up a team of wreckers,
  cancelling building leases) as well as ways in which GSA's central role can affect the wider government
  (canceling purchase cards, controlling shared services). He also has been a vocal booster to roll out
  an AI-based tool named GSAi to the whole workforce, despite it demonstrating lackluster results in pilot
  tests.
