  Anthony Armstrong comes to DOGE from the world of finance, where he worked on Musk's acquisition of
  Twitter as a bank executive at Morgan Stanley. Since joining DOGE at OPM, he has mostly operated quietly
  in a support role, but in April he was spotted at the FDIC, and I would expect him to be involved with
  DOGE's work against other independent financial entities. Although he has a relatively modest title,
  recently departed DOGE member Sahil Lavingia indicated that he was running operations for teams across
  government with Baris Akis and Steve Davis. Reportedly, he left his OPM position in April but continues
  to coordinate DOGE from within DHS. More recently, he was named to the position of CFO for Musk's xAI
  – just another example of the revolving door for Musk associates to cycle through DOGE and into reward
  positions in his companies.
