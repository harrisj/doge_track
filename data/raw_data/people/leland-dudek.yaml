blurb: |-
  DOGE is only able to subvert agencies when it has the explicit cooperation and support of senior leadership there. Nobody better
  exemplifies than Leland Dudek, who was a relatively minor supervisor within Social Security before he was placed on leave for
  insubordination by giving DOGE access without authorization. Soon, he was rewarded for his defiance by being named Acting
  Commissioner for the agency after the Trump administration fired the existing commissioner.

  With the appointment of Steve Bisignano to the role of Commissioner, Leland Dudek has stepped aside out of the limelight and
  was dismissed by SSA in June. In a recent interview with ProPublica, Dudek has stated that some of his apparent blustering
  and stumbling in the role were deliberate to wake up people to what was happening, and that he often was the leaked source
  for articles critical of himself and DOGE.
