:blurb: A veteran of the first Trump administration, he was reportedly placed on administrative
  leave in 2020 for establishing a pattern in a division of USAID that he ran where
  he would unilaterally freeze or revoke grants that he felt didn't reflect administration
  priorities. When employees spoke up about it, he would then accuse them of insubordination
  and attempt to get them suspended or fired. He sounds like a really nice guy, so
  it's probably not surprising that placing him in charge of USAID this year led to
  the rapid destruction of the agency. And it's also possibly why he himself was reportedly
  ousted from the State Department after the damage was complete. It would be comically
  ironic, if it didn't mean the loss of hundreds of valuable people in USAID and [hundreds
  of thousands of deaths](https://www.bu.edu/sph/news/articles/2025/tracking-anticipated-deaths-from-usaid-funding-cuts/)
  worldwide.
