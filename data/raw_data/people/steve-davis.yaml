  Reportedly so loyal to Elon Musk that associates have joked he would jump off a cliff if Musk asked him, Steve Davis has long been besides Musk's side at various companies, serving in senior executive roles at the Boring Company and Twitter. At Twitter, he was reportedly so dedicated to the work that he moved into the offices with his wife, Nicole Hollander, and their small child. And it is also reported that he was once so distressed by setbacks and failures that he started pulling out his own hair.
  It's been a thinly-veiled secret that Steve Davis was running the show at DOGE, well before Amy Gleason was publicly named as the administrator. And recent interviews with Sahil Lavingia and other insiders suggested he had continued to fill that role, until he abruptly departed after Elon Musk left.

  Despite no longer being in government, Steve Davis has reportedly stayed in contact with DOGE staffers and has directed their actions through back-channel communications. Reportedly, he has even called for the firing of DOGE staffers who expressed concerns about the legality of his continued involvement.
