    in cooperation with the US Treasury. This is to promote a program of special investment accounts that
    was passed by Congress but presented as if it's a result of Trump's personal largesse. It conveys
    a softer tone than many other of their sites, but still sticks to the same convention of a single
    page of text, with a FAQ presented as expandable accordions and a form to sign up for a mailing list.
