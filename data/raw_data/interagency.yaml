  type: legal
  event: >-
    A federal judge ruled that Elon Musk and senior State Department officials must sit for depositions
    about their roles in dismantling USAID. The judge cited the lack of documentation and no cooperation
    from other State Department staff as the reason there was "no alternative" to ordering the depositions.
  source: https://www.axios.com/2026/02/05/state-department-elon-musk-doge
  named:
  - Elon Musk
  agency:
  - USAID
