  event: >-
    All employees that were laid off from the Centers for Disease Control and the National Institute for
    Occupational Safety and Health as part of the massive HHS reduction in force have reportedly received
    notices that their RIF notices are revoked and remain employed. The RIF is being contested in court,
    but it's unclear what led to this specific reversal.
  agency:
  - CDC
