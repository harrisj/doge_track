    visa now will cost $1 million and be an expedited EB-1 or EB-2 visa; the original proposal has been
    rebranded as the platinum card, which will be "coming soon." The legality of this program still remains
    wildly unclear and demand is inflated because sign-up is through a public web form. This website is
    the first public work of recently-formed National Design Studio, although the previous version of
    the site was built by DOGE too.
