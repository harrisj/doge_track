  type: website
  event: >-
    The National Design Studio launches [realfood.gov](https://realfood.gov/) with HHS. Evoking more of
    a nostalgic and warm tone rather than the technocratic darkness of some prior sites, it is still a
    one-page site with large bold text, expandable accordions but now also with some scrolling animation.
