  type: website
  event: >-
    The [Trump RX](https://trumprx.gov/) site formally relaunches with a lookup option to find savings
    codes for various prescriptions. Like many other National Design Studio sites, it features a mix of
    Apple Store-style titles and text styling alongside gilt images of an American map and an eagle and
    bombastic language extolling Trump himself. In a first for NDS sites, it also features a site search
    to look up specific medications, each of which has their own page URL.
