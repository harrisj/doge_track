  event: >-
    The National Design Studio and OPM launch techforce.gov, a new site recruiting technical staff for
    a 2-year term to work on technical projects within agencies, a model that sounds similar to 18F and
    USDS, which were respectively completely destroyed and hollowed out by DOGE. The site features the
