- date: 2026-02-06
  type: disruption
  event: >-
    After pausing its actions because of a major winter storm, FEMA plans to resume an ongoing staffing
    reduction for Cadre of On-Call Response/Recovery (CORE) employees, who typically work in term-limited
    roles. Much like the Trump administration's mass firing of probationary employees last year, this
    reduction is targeting an entire class of federal employees for termination regardless of how good
    they are at their job. Up to half of FEMA's workforce are CORE employees, and it's unclear if these
    reductions are being driven by FEMA or DHS leadership.
  source: >-
    https://apnews.com/article/fema-staff-cuts-kristi-noem-winter-storm-fern-1b3a4ea77c6f299abda3f5046a6b24e5
  agency:
  - DHS
  - FEMA
  id: p8VCedvM

