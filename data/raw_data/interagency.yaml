  type: website
  event: >-
    The CIO Council launches a new version of its website [cio.gov](http://cio.gov) which has been redesigned
    by the National Design Studio. This site also includes a new [design system](https://cio.gov/system/tokens),
    which outlines a new style for websites but it lacks instructions, standardized CSS tags or web components
    found in other design systems like the [US Web Design System](https://designsystem.digital.gov/) and
    it has poor scores for accessibility. Nevertheless, with this launch, the National Design Studio has
    rebuilt a site with dozens of pages and has also implemented a site search for the first time.
  source: https://www.cio.gov/
  agency:
  - OMB
  - NDS
