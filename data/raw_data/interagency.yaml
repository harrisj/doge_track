  type: website
  event: >-
    Working with the White House and HHS, the National Design Studio launches the [TrumpRX](https://trumprx.gov/)
    to promote a forthcoming initiative from the White House to cap certain drug prices for private payers.
    This is the fourth website to bear the National Design Studio credit, and like the others it is a
    single-page site with expandable accordion elements of text and an email signup form.
  source:
  - https://gizmodo.com/trumprx-is-a-narcissistic-ai-generated-nightmare-2000671309
