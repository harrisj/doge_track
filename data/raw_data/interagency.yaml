- date: 2025-10-23
  type: official
  event: >-
    Seeking to further bolster support for its proposed new voter registration tool that would be integrated
    with DHS databases, the Election Assistance Commission hosts a call with the National Association
    of Secretaries of State. Akash Bobba speaks on the call as a developer and reports it will be created
    by the National Design Studio and integrate with the revamped SAVE database from DHS. When asked for
    details about data retention and security, Bobba could only state that "clear data retention policies"
    would be provided to states in advance.
  named:
  - Akash Bobba
  agency:
  - NDS
  - DHS
  source: >-
    https://www.votebeat.org/2025/10/27/trump-administration-proposes-online-federal-voter-registration-form/
