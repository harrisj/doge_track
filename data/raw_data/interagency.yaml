- date: 2025-10-06
  type: onboard
  event: >-
    The Trump Administration names Frank Bisignano, the current administrator of SSA, as the Chief Executive
    Officer of the IRS, a position which does not actually exist. Technically, Scott Bessent will remain
    the seventh acting commissioner to run the IRS this year, but this new role seems to be a way to give
    Frank Bisignano direct authority over decision-making at the agency while also preserving some amount
    of deniability and allowing the Trump admininistration to once again sidestep the Senate confirmation
    process.
  source: https://www.washingtonpost.com/business/2025/10/06/irs-ceo-social-security/
  named:
  - Frank Bisignano
  agency:
  - IRS
  - SSA
