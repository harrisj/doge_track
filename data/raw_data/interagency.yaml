- date: 2025-10-17
  type: official
  event: >-
    The Trump Administration announces plans for a digital version of the existing federal voter registration
    form that would be created by the National Design Studio and would run voter identity and citizenship
    checks against SAVE and other DHS systems before allowing voters to register. States of course have
    their own voter registration processes but have accepted the paper federal registration form as well.
    Notes from the call with National Association of State Election Directors reported that election officials
    from both parties expressed concern about this plan not complying with state laws. They also reported
    “the developers do not seem to want to spend the time to understand election official concerns.”
  agency:
  - NDS
  - DHS
  source: >-
    https://www.votebeat.org/2025/10/27/trump-administration-proposes-online-federal-voter-registration-form/
