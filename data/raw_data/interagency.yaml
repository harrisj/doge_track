  type: report
  event: >-
    The news site Nextgov reports that the National Design Studio's new site [realfood.gov](https://realfood.gov)
    is directing users directly to Elon Musk's Grok AI product. After being contacted by reporters for
    comment, the link is instead labeled as "Ask AI" but stll points to the Grok site.
  source: >-
    https://www.nextgov.com/digital-government/2026/02/trumps-nutrition-website-directs-users-elon-musks-grok/411323/
  agency:
  - NDS
  - HHS
