    Ruling in _American Council of Learned Societies/Authors Guild v. NEH_, Judge Colleen McMahon rejects
    an argument by the government that a spreadsheet listing all of the DOGE staff and their positions
    and detailing arrangement must remain sealed for their personal safety. She orders them and a series
