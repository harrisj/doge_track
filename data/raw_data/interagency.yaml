  type: oversight
  event: >-
    The ranking Democratic member of the Senate Comittee on Homeland Security and Governmental Affairs
    releases a report "Unchecked and Unaccountable" detailing DOGE security transgressions at several
    agencies, including poor security for the NUMIDENT data at SSA and activities within GSA and OPM
  source: https://www.hsgac.senate.gov/wp-content/uploads/DOGE_REPORT_FINAL_7.pdf
