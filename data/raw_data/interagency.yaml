  - GSA
  - DOGE
  interagency_doge_reps:
    GSA:
    - Nate Cavanaugh
    - Ethan Shaotran
    DOGE:
    - Jacob Altik
  case_no: 1:25-cv-00778
  id: CuJmM2lv

