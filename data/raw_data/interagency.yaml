- date: 2025-07-14
  type: disruption
  event: >-
    Months after the destruction of USAID and folding in some of its staff and responsibilities into the
    US Department of State, the Trump administration incinerates 500 million tons of emergency food biscuits
    worth $800,000 rather than sending it to Afghanistan and Pakistan, where it could have fed 1.5 million
    children for a week because it was due to expire. Marco Rubio had promised the House Appropriations
    Committee that he would ensure food aid is distributed before expiration, but the government eliminated
    all aid to Afghanistan and refused to divert the food to other emergency crises. The cost of destroying
    the biscuits will be $130,000 making this nearly a $1 million dollar loss incurred by DOGE (not to
    mention lives that will be lost).
