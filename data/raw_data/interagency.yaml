  type: disruption
  event: >-
    In a memo released by OMB detailing operations during the government shutdown, OMB reveals that there
    are 45 people in the DOGE office who will continue to work during the shutdown because it is not funded
    through a normal appropriations process.
  source: >-
    https://www.bloomberg.com/news/articles/2025-10-03/white-house-keeps-45-doge-employees-working-despite-shutdown
  agency:
  - OMB
