  type: interagency
  event: >-
    CMS publishes a notice in the Federal Register that it intends to share information on suspected undocumented
    immigrants with ICE, using Medicaid data that has been sourced to the agency from states. Multiple
    states have sued CMS over a previous order mandating these data-sharing arrangements, precisely because
    they were concerned about how the data might be used.
