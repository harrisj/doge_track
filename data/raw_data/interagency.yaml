- date: 2025-02-21
  type: interagency
  event: >-
    Ethan Shaotran and Nate Cavanaugh return to the IAF with Jacob Altik, who presented himself as representing
    the EOP. Altik confirms that DOGE plans to reduce IAF to what he considers the statutory minimum (a
    board and president, a location in DC, some grants) and DOGE will be conducting a Reduction in Force
    of all employees and terminating all grants. The demand approval from the board and threaten the board
    will be fired otherwise.
  source: https://storage.courtlistener.com/recap/gov.uscourts.dcd.278466/gov.uscourts.dcd.278466.35.2_1.pdf
