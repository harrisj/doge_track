  type: legal
  event: >-
    Several nonprofit organizations led by the League of Women Voters filed a lawsuit against the DOGE-led
    project to add Social Security data and expand the usage of the SAVE database for invalidating voter
    registrations. The suit alleges that this process violated the Privacy Act but also is an unconstitutional
