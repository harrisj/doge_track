  type: report
  event: >-
    Speaking at the ACT-IAC Summit, Federal CIO Greg Barbaccia touted the work of the National Design
    Studio and reported that OMB is working closely with NDS to "coalesce" the administration's website
    design, comparing it to how certain hotel brands will all look and smell the same. He reports there
    are internal sandboxes running for new designs and a redesigned site for CIO.gov will soon illustrate
    the new look. The NDS is also reportedly leaning heavily into using AI for its work. In addition,
    35,000 people have applied to the administration's Tech Force initiative and they are reviewing 6,000
    applicants.
  source: https://fedscoop.com/federal-website-national-design-studio-greg-barbaccia/
