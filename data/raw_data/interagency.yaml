- date: 2025-07-14
  type: disruption
  event: >-
    Declaring that a Supreme Court shadown docket ruling on July 8th gave them the go-ahead, HHS declares
    a Reduction-in-Force that was initiated on April 1st is still in effect by sending affected employees
    a messages stating "You are hereby notified that you are officially separated from HHS at the close
    of business on July 14, 2025. Thank you for your service to the American people." The number of affected
    employees is in the thousands, but some of the 10,000 fired in the original RIF are still protected
    by another case _New York v. Kennedy_.
