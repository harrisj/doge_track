- id: 14151
  title: Ending Radical and Wasteful Government DEI Programs and Preferencing
  date: 2025-01-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14151-ending-radical-and-wasteful-government-dei-programs-and-preferencing
  summary: >-
      This order establishes the administration's targeting of "DEI" as
      something to be eliminated in the federal government. It includes a
      directive for the head of the OPM to eliminate DEI in hiring practices and
      federal employment policies. It also includes directives to agencies to
      eliminate DEI-related positions as well as contracts, and a monthly
      meeting with OPM, OMB and agency heads to report on the costs of social
      justice measures for their agencies. This order does not mention DOGE (and
      precedes it), but DOGE is heavily involved in writing programs to look for
      DEI keywords and delete web pages, etc.
  all_agencies: true
  directs_doge: false

- id: 14158
  title: Establishing and Implementing the President's "Department of Government Efficiency"
  date: 2025-01-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14158-establishing-and-implementing-the-presidents-department-government
  summary: >-
      Renames the US Digital Service to the US DOGE Service and also defines an
      entity for Special Government Employees to work within it named the DOGE
      Temporary Organization. This order also specifies the structure of
      4-person DOGE teams that will embed within agencies to implement "the
      President's DOGE agenda." It also states that DOGE will be focused
      primarily on IT modernization activities within agencies, that they must
      be granted widespread access and that they will adhere to "rigorous data
      protection standards."
  agencies:
      - DOGE
  directs_doge: true
  all_agencies: true

- id: 14159
  title: Protecting the American People Against Invasion
  date: 2025-01-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14159-protecting-the-american-people-against-invasion
  summary: >-
      This Executive Order has nothing to do directly with DOGE, but it does
      establish the "emergency" framing that the Trump administration has used
      around framing and it does lay out the groundwork for the work DOGE will
      do later to create large data lakes to surveil immigrants.
  all_agencies: true
  directs_doge: false

- id: 14169
  title: Reevaluating and Realigning United States Foreign Aid
  date: 2025-01-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14169-reevaluating-and-realigning-united-states-foreign-aid
  summary: >-
      This executive order mandated a 90-day pause on all foreign aid grants
      from the United States so they could be reviewed and it commanded the OMB
      to enforce this pause through withholding apportionments as necessary. It
      also granted the Secretary of State the power to approve funds that had
      been paused. This EO did not mention DOGE or USAID specifically, but it
      was the basis for DOGE's intervention and destruction of that agency.
  agencies:
      - State
      - USAID
  all_agencies: false
  directs_doge: false

- id: 14170
  title: Reforming the Federal Hiring Process and Restoring Merit to Government Service
  date: 2025-01-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14170-reforming-the-federal-hiring-process-and-restoring-merit-government
  summary: >-
      "Within 120 days of the date of this order, the Assistant to the President
      for Domestic Policy, in consultation with the Director of the Office of
      Management and Budget, the Director of the Office of Personnel Management,
      and the Administrator of the Department of Government Efficiency (DOGE),
      shall develop and send to agency heads a Federal Hiring Plan that brings
      to the Federal workforce only highly skilled Americans dedicated to the
      furtherance of American ideals, values, and interests."
  agencies:
      - OPM
      - DOGE
  all_agencies: true
  directs_doge: true

- id: 14179
  title: Removing Barriers to American Leadership in Artificial Intelligence
  date: 2025-01-23
  link: https://www.presidency.ucsb.edu/documents/executive-order-14179-removing-barriers-american-leadership-artificial-intelligence
  summary: >-
      This order revoked Biden-era executive orders and memos on how Artificial
      Intelligence can be utilized within the government. Those established some
      guardrails to ensure that AI training would not leak data to unauthorized
      locations, that AI programs would not perpetuate bias, and that AIs would
      not be used to make decisions or determinations until it had been cleared
      through a pilot program. This executive order does not mention DOGE, but
      it enables their widespread use of AI without needing to follow any of the
      safeguards of the Biden admininstration.
  all_agencies: false
  directs_doge: false

- id: 14192
  title: Unleashing Prosperity Through Deregulation
  date: 2025-01-31
  link: https://www.presidency.ucsb.edu/documents/executive-order-14192-unleashing-prosperity-through-deregulation
  summary: >-
      This executive order tasked agencies with reducing regulations by putting
      caps on their ability to new regulations. Specifically, a new regulation
      could only be proposed if 10 regulations are eliminated, and the projected
      costs must be zero or negative (by removing other regulations). It's
      unclear if these targets were rigidly enforced (for instance, OPM has been
      ordered to issue multiple new regulations over the last few months), but
      it does formalize the Project 2025 framing that all regulation is bad with
      an OKR-style metric for DOGE to enforce.
  all_agencies: true
  directs_doge: false

- id: 14210
  title: Implementing the President's "Department of Government Efficiency" Workforce Optimization Initiative
  date: 2025-02-11
  link: https://www.presidency.ucsb.edu/documents/executive-order-14210-implementing-the-presidents-department-government-efficiency
  summary: >-
      This executive order set an benchmark for attrition at various agencies,
      mandating that agencies can only hire 1 new person if 4 people are removed
      (ie, a 75% reduction). It also tasked agency heads to work with DOGE leads
      in their agencies to develop "a data-driven plan" for prioritizing new
      hires in the areas of highest need. It also granted the local DOGE team
      lead with the power to determine if any vacancy should be filled and to
      veto any potential hire into career positions.
  all_agencies: true
  directs_doge: true

- id: 14215
  title: Ensuring Accountability for All Agencies
  date: 2025-02-18
  link: https://www.presidency.ucsb.edu/documents/executive-order-14215-ensuring-accountability-for-all-agencies
  summary: >-
      This executive order laid out the concept that independent agencies that
      were created as such by Congress are not allowed to be independent and
      must instead report to the President. Furthermore, any regulations they
      propose must be cleared by the White House's Office of Information and
      Regulatory Affairs (OIRA) within OMB first. It also claims that Federal
      employees are not allowed to use their own interpretations to determine
      what actions are legal or illegal; instead, the law is what the President
      or the Attorney General says it is (and since the Trump DOJ had already
      rejected the independence of the AG, this means the law is what the
      President alone says it is). Needless to say, this has been heavily
      litigated in court, but it serves as the administration's justification
      for cracking down on independent agencies.
  all_agencies: true
  directs_doge: false

- id: 14217
  title: Commencing the Reduction of the Federal Bureaucracy
  date: 2025-02-19
  link: https://www.presidency.ucsb.edu/documents/executive-order-14217-commencing-the-reduction-the-federal-bureaucracy
  summary: >-
      The first executive order that targeted direct action against some of the
      small independent agencies. In this case, it ordered that the Presidio
      Trust, the Inter-American Foundation, the United States African
      Development Foundation, the United States Institute of Peace must be
      reduced to their minimum statutory functions within 14 days. This
      Executive Order did not name DOGE, but it was the justification for Nate
      Cavanaugh's invasion of those agencies.
  agencies:
      - IAF
      - USADF
      - USIP
  all_agencies: true
  directs_doge: false

- id: 14218
  title: Ending Taxpayer Subsidization of Open Borders
  date: 2025-02-19
  link: https://www.presidency.ucsb.edu/documents/executive-order-14218-ending-taxpayer-subsidization-open-borders
  summary: >-
      Another executive order focused on immigration. This one is focused on the
      fear that immigrants might be illegally accessing government resources and
      using public funds. To that end, it directs various public programs to use
      automated eligibility verification systems before providing services. It
      also commands for OMB and DOGE to examine all possible sources of federal
      funding for agencies and to issue a report and recommendation within 30
      days. In essence, it augments DOGE's generic permit to rifle through
      agency expenditures to give them an additional anti-immigration support.
  all_agencies: true
  directs_doge: true

- id: 14219
  title: >-
      Ensuring Lawful Governance and Implementing the President's "Department of
      Government Efficiency" Deregulatory Initiative
  date: 2025-02-19
  link: https://www.presidency.ucsb.edu/documents/executive-order-14219-ensuring-lawful-governance-and-implementing-the-presidents
  summary: >-
      Following up on the previous deregulatory EO, this one tasks agency heads
      to work with their DOGE teams and the head of the OMB (ie, Russell Vought)
      to identify various regulations that should be eliminated and provides a
      list of regulation categories that the executive order has determined are
      unlawful, including a notion that agencies should only stick to a very
      limited notion of statutory authority.
  all_agencies: true
  directs_doge: true

- id: 14222
  title: Implementing the President's "Department of Government Efficiency" Cost Efficiency Initiative
  date: 2025-02-26
  link: https://www.presidency.ucsb.edu/documents/executive-order-14222-implementing-the-presidents-department-government-efficiency-cost
  summary: >-
      This executive order directed all agencies to work with their DOGE teams
      to build a single centralized system to record all payments made by the
      agency with the requirement that every requested payment must include a
      brief written justification for the services. It also grants the authority
      to DOGE teams to review all contracts and grants at the agencies and
      terminate at their discretion any grants they feel don't serve the
      administration or should have their costs recovered. This executive order
      gave DOGE the justification to demand access to grants in all agencies and
      set a 30-day deadline to support their practice of demanding emergency
      powers to do so. This order also placed a 30-day freeze on all spending
      cards (implemented by the GSA setting a $1 limit for them) and elimination
      of all non-essential travel. Finally, this EO commanded all agencies to
      follow the GSA's lead and terminate any unnecessary building leases within
      30 days.
  all_agencies: true
  directs_doge: true

- id: 14238
  title: Continuing the Reduction of the Federal Bureaucracy
  date: 2025-03-14
  link: https://www.presidency.ucsb.edu/documents/executive-order-14238-continuing-the-reduction-the-federal-bureaucracy
  summary: >-
      This order built on the methods outlined in EO 14217, and expanded the
      list of agencies that must be immediately wound down to a bare minimum to
      include the Federal Mediation and Conciliation Service, the United States
      Agency for Global Media (parent of VOA, the Woodrow Wilson International
      Center for Scholars in the Smithsonian Institution, the Institute of
      Museum and Library Services, the United States Interagency Council on
      Homelessness, the Community Development Financial Institutions Fund and
      the Minority Business Development Agency. These agencies were given only 7
      days to comply and some were immediately visited by Nate Cavanaugh to
      ensure their destruction.
  agencies:
      - FMCS
      - USAGM
      - WWICS
      - IMLS
      - USICH
      - CDFIF
      - MBDA
  all_agencies: true
  directs_doge: false

- id: 14240
  title: Eliminating Waste and Saving Taxpayer Dollars by Consolidating Procurement
  date: 2025-03-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14240-eliminating-waste-and-saving-taxpayer-dollars-consolidating
  summary: >-
      This executive order directed agencies to submit plans within 60 days of
      how their procurement could instead be conducted by GSA instead of by the
      agency itself. It also designated the Administrator of the GSA as the
      executive agent for any government-wide acquisition contracts (GWAC) for
      IT. This means that the GSA becomes the sole entity to negotiate and/or
      continue IT contracts for software and services at various agencies.
      Although this order does not explicitly mention DOGE, the GSA's technology
      division is heavily controlled by DOGE and the GSA Administrator, Stephen
      Ehikian, is considered a DOGE associate.
  agencies:
      - GSA
  all_agencies: true
  directs_doge: false

- id: 14243
  title: Stopping Waste, Fraud, and Abuse by Eliminating Information Silos
  date: 2025-03-20
  link: https://www.presidency.ucsb.edu/documents/executive-order-14243-stopping-waste-fraud-and-abuse-eliminating-information-silos
  summary: >-
      This order was designed to formalize the widespread data access that DOGE
      has already demanded from agencies. Claiming it is motivated by a desire
      to eliminate information silos, it ordered that agencies must make all
      efforts to ensure that agency heads or their designees (i.e., DOGE) must
      have full access to any unclassified data that they request. Furthermore,
      they must be given access to any data provided by states that participate
      in federal programs. It also included a specific instruction that the
      Secretary Labor (or his designee) should have access to unemployment
      records that belonged to their Inspector General, a direct granting of
      access to a dataset that DOGE had been coveting.
  agencies:
      - DOL
  all_agencies: true
  directs_doge: false

- id: 14247
  title: Modernizing Payments to and From America's Bank Account
  date: 2025-03-25
  link: https://www.presidency.ucsb.edu/documents/executive-order-14247-modernizing-payments-and-from-americas-bank-account
  summary: >-
      This order moves to eliminate the use of paper checks by the federal
      government by the date of September 30th. More importantly, it moves to
      centralize all payment processing of electronic payments to route through
      the Treasury department.
  agencies:
      - Treasury
      - HHS
      - State
      - Education
      - VA
      - DHS
      - SSA
  all_agencies: true
  directs_doge: false

- id: 14248
  title: Preserving and Protecting the Integrity of American Elections
  date: 2025-03-25
  link: https://www.presidency.ucsb.edu/documents/executive-order-14248-preserving-and-protecting-the-integrity-american-elections
  summary: >-
      This order attempts to assert greater federal control over the voter
      registration process for each state towards verifying that only citizens
      are voting (a frequent trope in anti-immigrant rhetoric on the right wing
      despite the lack of any evidence it happens regularly). To that end, it
      lays out some requirements for states that have triggered lawsuits for
      overreach``. It also directs that the Social Security Administration to
      make available to state and local officials the "Social Security Number
      Verification Service, the Death Master File, and any other Federal
      databases" for use in verifying individuals. It also directs DHS to work
      with DOGE on reviewing the voter registration lists for each state against
      immigration records in the idea that they will be able to identify
      patterns of illegal voting. And it threatens to withhold election funds
      from the FEC for any state that refuses to comply.
  agencies:
      - SSA
      - FEC
  all_agencies: true
  directs_doge: true

- id: 14270
  title: Zero-Based Regulatory Budgeting To Unleash American Energy
  date: 2025-04-09
  link: https://www.presidency.ucsb.edu/documents/executive-order-14270-zero-based-regulatory-budgeting-unleash-american-energy
  summary: >-
      This executive order is targeted against regulations affecting the energy
      sector, ordering agencies to add sunset clauses to their regulations so
      they can regularly re-assess if oil spills or acid rain caused by coal
      plant emissions are now actually good. This order is explicitly targeted
      at the Environmental Protection Agency (EPA), the Department of Energy
      (DoE), the Federal Energy Regulatory Commission (FERC), and the Nuclear
      Regulatory Commission (NRC). It also includes the Bureau of Land
      Management within the Department of the Interior. As such, it explicitly
      mentions that the DOGE teams already integrated into these agencies should
      be involved with the regulatory review process.
  agencies:
      - EPA
      - Energy
      - NRC
      - DOI
  all_agencies: true
  directs_doge: true

- id: 14275
  title: Restoring Common Sense to Federal Procurement
  date: 2025-04-15
  link: https://www.presidency.ucsb.edu/documents/executive-order-14275-restoring-common-sense-federal-procurement
  summary: >-
      This order calls for significant revisions to the Federal Acquisition
      Register (FAR) – the complicated rules that govern how the US procures
      goods and services. While there is a real need to streamline aspects of
      the FAR, this effort could also serve as a cover to the executive branch
      to influence how contracts are awarded. Noting it here because DOGE has
      been linked to efforts within the FAA to redirect contracts to use
      Starlink.
  all_agencies: false
  directs_doge: false

- id: 14271
  title: Ensuring Commercial, Cost-Effective Solutions in Federal Contracts
  date: 2025-04-15
  link: https://www.presidency.ucsb.edu/documents/executive-order-14271-ensuring-commercial-cost-effective-solutions-federal-contracts
  summary: >-
      This executive order specifically constrains the ability of the federal
      government to create custom software, by mandating that any proposed
      procurement for custom development work must include a justification for
      why it couldn't be handled by an off-the-shelf product and must get
      explicit approval from agency leadership (and probably DOGE staff) to
      proceed. This would be a boon to Silicon Valley firms like Oracle,
      Salesforce or Palantir while also diminishing the ability of agencies to
      own the systems they operate, restoring the perpetual licensing-fee
      treadmill that has plagued many agency IT operations.
  all_agencies: true
  directs_doge: false

- id: 14284
  title: Strengthening Probationary Periods in the Federal Service
  date: 2025-04-24
  link: https://www.presidency.ucsb.edu/documents/executive-order-14284-strengthening-probationary-periods-the-federal-service
  summary: >-
      Issued in the wake of preliminary injunctions that found OPM radically
      overstepped its bounds demanding the indiscriminate termination of
      probationary employees, this executive order proposes a new regulation
      that would require agencies and employees in probationary periods (ie, in
      the first year of a role, whether as a new hire or promotion) affirm why
      they should continue to be hired or be automatically terminated. As a
      result of this ruling, federal staff could find themselves promoted into
      new responsibilities and then fired because their their case for continued
      employment was not considered adequate or the administration wants to
      reduce headcount.
  all_agencies: false
  directs_doge: false

- id: 14290
  title: Ending Taxpayer Subsidization Of Biased Media
  date: 2025-05-01
  link: https://www.presidency.ucsb.edu/documents/executive-order-14290-ending-taxpayer-subsidization-biased-media
  summary: >-
      This executive order commanded the Corporation for Public Broadcasting
      (CPB) board of directors to cease any funding and support for the Public
      Broadcasting Service (PBS) TV network and National Public Radio (NPR). As
      an independent agency, the CPB is not obliged to listen to the President,
      but this administration has already asserted its right for absolute
      executive control in EO 14215. The main purpose of this EO was to
      coordinate its efforts [with an attack on the CPB by
      DOGE](/agencies/independent#arts) and as an angry response to CPB seeking
      a restraining order against the Trump administration for trying to fire
      its board a few days prior.
  agencies:
      - CPB
  all_agencies: false
  directs_doge: false

- id: 14300
  title: Ordering the Reform of the Nuclear Regulatory Commission
  date: 2025-05-23
  link: https://www.presidency.ucsb.edu/documents/executive-order-14300-ordering-the-reform-the-nuclear-regulatory-commission
  summary: >-
      This executive order commands the Nuclear Regulatory Commission to reduce
      its regulatory oversight over the nuclear energy sector, with the goal of
      radically increasing the number of nuclear reactors in America. This would
      be just another example of the Trump Administration/Project 2025
      insistence that industry can regulate itself, but it does explicitly
      direct that the NRC must consult with a DOGE team assigned to the agency
      both on how to streamline the regulatory process for nuclear reactors and
      to conduct a reduction-in-force to layoff an unstated number of staff.
  agencies:
      - NRC
      - DOGE
  all_agencies: false
  directs_doge: true

- id: 14301
  title: Reforming Nuclear Reactor Testing at the Department of Energy
  date: 2025-05-23
  link: https://www.presidency.ucsb.edu/documents/executive-order-14301-reforming-nuclear-reactor-testing-the-department-energy
  summary: >-
      This order commands the Department of Energy to revise the rules around
      testing new nuclear reactors and to expedite any environmental rules that
      might hinder the development of new reactors. This would be just another
      example of the Trump ethos that industry can regulate itself, but it also
      includes a specific provision that the DOGE Team at the Department of
      Energy must be involved in this effort.
  agencies:
      - Energy
  all_agencies: false
  directs_doge: true

- id: 14306
  title: >-
      Sustaining Select Efforts to Strengthen the Nation's Cybersecurity and
      Amending Executive Order 13694 and Executive Order 14144
  date: 2025-06-06
  link: https://www.presidency.ucsb.edu/documents/executive-order-14306-sustaining-select-efforts-strengthen-the-nations-cybersecurity-and
  summary: >-
      This executive order defines some revisions to several cybersecurity
      executive orders issued by the Biden administration and directs NIST and
      CISA to make some adjustments to their requirements. It also includes a
      command to strike out the sentence "Open source software plays a critical
      role in Federal information systems." from federal cybersecurity guidance,
      reinforcing the admininistration moving away from open-source to
      proprietary licensed technologies that would be licensed to the government
      by tech firms.
  agencies:
      - NIST
      - CISA
  all_agencies: false
  directs_doge: false

- id: 14338
  title: Improving Our Nation Through Better Design
  date: 2025-08-21
  link: https://www.presidency.ucsb.edu/documents/executive-order-14338-improving-our-nation-through-better-design
  summary: >-
      This executive order established the creation of a new National Design
      Studio within the White House and a Chief Design Officer who will be in
      charge of defining standards for the look and functionality of federal
      websites. The executive order also directs the Chief Design Officer to
      update the existing US Web Design System. Although this order does not
      explicitly mention DOGE, it borrows from the same playbook, designating
      that the National Design Studio will be under the leadership of an
      Administrator and creating a temporary organization within the National
      Design Studio as a likely place to hire special government employees. This
      resemblence is underscored by the fact that Joe Gebbia has been tapped to
      be the first Chief Design Officer.
  agencies:
      - NDS
  all_agencies: true
  directs_doge: false

- id: 14351
  title: The Gold Card
  date: 2025-09-19
  link: https://www.presidency.ucsb.edu/documents/executive-order-14351-the-gold-card
  summary: >-
      This order formally launches the Trump "Gold Card" visa program that was teased in a site built by DOGE earlier
      in the year and relaunched by the National Design Studio. This program will allow applicants to pay a $1 million
      fee to purchase a special immigration visa for the US.
  agencies:
      - Commerce
      - State
      - DHS
  all_agencies: false
  directs_doge: false

- id: 14356
  title: Ensuring Continued Accountability in Federal Hiring
  date: 2025-10-15
  link: https://www.presidency.ucsb.edu/documents/executive-order-14356-ensuring-continued-accountability-federal-hiring
  summary: >-
      This executive order restructures the hiring restrictions established in EO 14210 and requires agencies to establish
      new Strategic Hiring Committees to file annual hiring plans with OPM and OMB. The composition of the hiring committees
      is left up to agency leadership and this removes the control of DOGE staff over the hiring process.
  agencies:
      - OMB
      - OPM
  all_agencies: true
  directs_doge: false

- id: 14363
  title: Launching the Genesis Mission
  link: https://www.presidency.ucsb.edu/documents/executive-order-14363-launching-the-genesis-mission
  date: 2025-11-24
  summary: >-
      This executive order announces the launch of the Genesis Mission, a cross-agency federal framework to "unleash a new
      age of AI." The launch site for this project at the Department of Energy was designed by the National Design Studio.
      Coordination will also be run the OSTP head Michael Kratsios. It also directs the secretary of the Department of Energy
      to identify if agency resources and supercomputing factilities can be allocated towards AI and robotics research.
  agencies:
      - Energy
      - EOP
  all_agencies: false
  directs_doge: false

- id: 14365
  title: Ensuring a National Policy Framework for Artificial Intelligence
  date: 2025-12-11
  link: https://www.presidency.ucsb.edu/documents/executive-order-14365-ensuring-national-policy-framework-for-artificial-intelligence
  summary: >-
      This executive order argues that the Trump administration must take aggressive action against state regulations of AI. In the
      absence of Congressional legislation, the DOJ will establish an AI Litigation Task Force to challenge any state laws against
      AI that counter. It also orders the task force to coordinate with Crypto czar David Sacks, OSTP leader Micheal Kratsios among others
      on which state laws to target. It also lays out a framework for states to be denied funds that were appropriated for broadband
      improvements that were impounded by the Trump Administration.
  agencies:
      - Commerce
      - EOP
      - DOJ
  all_agencies: false
  directs_doge: false

- id: 14385
  title: Protecting the National Security and Welfare of the United States and its Citizens from Criminal Actors and Other Public Safety Threats
  link: https://www.presidency.ucsb.edu/documents/executive-order-14385-protecting-the-national-security-and-welfare-the-united-states-and
  date: 2026-02-06
  summary: >-
      This executive order directs that federal criminal justice agencies must share criminal history record information (CHRI) immediately
      with DHS, to the maximum extent allowed by law. It is unclear how this executive order is related to the data-sharing between
      other agencies and DHS for an immigration surveillance system being constructed by DOGE.
  agencies:
      - DOJ
      - FBI
      - DHS
      - ICE
  all_agencies: false
  directs_doge: false
