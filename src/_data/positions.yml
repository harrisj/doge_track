    short_name: CFPB
    blurb: >-
      After several weeks of quiet, the DOGE wrecking crew descended on the CFPB on a Thursday in early February. By Friday, they had been granted admin
      access to multiple systems with the support of acting director Russell Vought and had deleted the homepage for the website. By Monday, the entire
      workforce of the agency had been place on administrative leave and blocked from accessing the building. Despite some still-lingering concerns about
      Musk gaining access to proprietary financial data for his competitors, DOGE's main focus at the agency was making an example of it, with many of the
      crew who had demolished USAID taking part in this effort. Their attempt at forcing mass layoffs on February 14 was stopped at only the last minute
      by a judge's temporary restraining order, and DOGE assisted with another reduction-in-force (RIF) for 80% of the agency on April 17th, only for it
      to be overturned by the same judge. Today, the CFPB is still alive, but in a precarious limbo that might make months or year to resolve.
    blurb_date: '2025-05-12'
    doge_base: true
