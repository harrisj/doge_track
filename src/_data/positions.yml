    blurb: >-
      It has not always been easy to identify DOGE's activities within Health and Human Services. Early coverage following DOGE's activities at the children
      of HHS – themselves massive agencies like CDC, CMS and FDA – often missed the forest for the trees. Thankfully, government-supplied declarations in
      court cases like _AFL-CIO vs. DOL_ have provided details and context. HHS has been a target of every single one of DOGE's various initiatives. Early
      cost-cutting efforts eliminated staff at the CDC and the FDA, which also was targeted for deregulation. As the parent of Medicare and Medicaid, CMS
      was a natural target to be scrutinized for excessive costs, but DOGE has yet to make any wildly unsubstantiated claims there. More recently, DOGE
      has been using some of the HHS databases to mine for data on immigrants, and their access to the medical claims of millions of Americans should be
      troubling to all.
