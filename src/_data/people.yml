    booster <a class="link-hover" href="/all/people#anthony-jancso">Anthony Jancso</a>; this is likely what brought him into <a class="link-hover" href="/agencies/white-house">DOGE</a>.
    In <a class="link-hover" href="/agencies/white-house">DOGE</a> itself, he has kept a relatively low profile, but he worked alongside <a class="link-hover"
    href="/wreckers/luke-farritor">Luke Farritor</a> and <a class="link-hover" href="/wreckers/gavin-kliger">Gavin Kliger</a> in <a class="link-hover" href="/agencies/white-house">DOGE</a>'s
    takeover of the <a class="link-hover" href="/agencies/cfpb">CFPB</a>, and he has stayed on as a full-time staffer at the agency since March 5th, even
    as he has been deployed elsewhere.
  start_date: 2025-01-(20)~
