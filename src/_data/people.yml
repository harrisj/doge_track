  category: wrecker
  own_page: false
  blurb: >-
    A former tech entrepeneur, Nate Cavanaugh was initially spotted as one of the DOGE staffers interviewing GSA federal staff to determine layoffs. Since
    March however, he has been the de facto leader of DOGE's [sustained attacks against multiple independent agencies](/agencies/independent) such as the
    NEH or IMLS. These attacks begin with Nate offering IT Modernization assistance from the GSA and then escalate through the White House firing agency
    leadership and naming Nate (or an associate) as the new acting agency head. Once in power, he quickly places all employees on administrative leave and
    starts firing staff and cancelling grants. Much like a vampire, if he shows up at the door of your agency, do not let him inside.
  reporting_notes:
