- date: November 2024
  title: Project Kickoff
  text: >-
      A week after his victory, Trump invites both Elon Musk and Larry Ellison to a transition
      planning meeting in Mar-A-Lago. This kicks off a [frenetic planning
      period](https://www.nytimes.com/2024/12/06/us/politics/trump-elon-musk-silicon-valley.html)
      with Musk associates like Marc Andreessen, Shaun Maguire, Jared Birchall and Steve Davis
      laying the groundwork of the DOGE plan.
- date: December 2024
  title: Recruitment Begins
  text: >-
      Early DOGE members Anthony Jancso and Luke Farritor post [recruitment messages for
      DOGE](https://www.wired.com/story/elon-musk-doge-recruiting-palantir/) to online forums
      like a Discord for SpaceX interns or a chat group for Palantir alumni.
- date: January 2025
  title: Getting Ready for Launch
  text: >-
      In the weeks before the Inauguration, DOGE solidifies on its pitch to recruits: six-month
      stints of 80-hour weeks without pay. The plan to also [subvert the US Digital Service and
      use it as a base for
      DOGE](https://www.nytimes.com/2025/01/12/us/politics/elon-musk-doge-government-trump.html)
      is also finalized.
- date: 2025-01-20
  title: Inauguration Day
  text: >-
      Donald Trump is formally sworn in as the 47th President of the United States and starts
      signing a flurry of [executive orders](/projects/exec-orders), including the ones that
      establish DOGE's organizational structure and role in important government operations.
- date: 2025-01-20
  title: Building the Bases
  text:
      DOGE moves into its news bases of operation at the [White House](/agencies/eop) as well
      as OPM and GSA. This includes creating walled-off enclaves with couches and even sleeping
      areas. At OPM, acting director Charles Ezell quickly replaces the CIO with Greg Hogan and
      Stephen Ehikian and Nicole Hollander start at GSA, with Thomas Shedd named as the new TTS
      commissioner within days.
- date: 2025-01-21
  title: '"We Ask the Questions Here"'
  text:
      DOGE-affiliated staffers start interviewing US Digital Service staff as well as 18F
      staffers at GSA. They refuse to identify themselves or answer questions, and they seem to
      be interested in employee's feelings towards Trump and Musk more than their technical
      skills.
- date: 2025-01-21
  title: Detailing Begins
  text: >-
      DOGE begins placing staff in different agencies than their own – this process is called
      _detailing_ in the federal government – with Luke Farritor setting up shop within HHS and
      Marko Elez and Tom Krause arriving at Treasury. In the following months, DOGE teams
      consisting of staff that I call [Wreckers](/people/wreckers/) detailed from DOGE, OPM and
      GSA show up at multiple agencies, following a specific offensive playbook against agency
      operations and personnel.
- date: 2025-01-23
  title: Test Emails
  text: >-
      The DOGE team at OPM sends out a first email to all government personnel using a
      newly-installed Government Wide Email System (GWES). This is followed by a second test
      message a few days later.
- date: 2025-01-27
  title: Arrival at USAID
  text: >-
      DOGE representatives first arrive at the agency, with senior staff summoned to a virtual
      meeting with Gavin Kliger and Luke Farritor later that day. In the coming days, DOGE will
      trial the methods it uses to destroy other agencies on USAID. This includes placing all
      staff on administrative leave and locking them out of the building and their computers,
      cancelling contracts, sending out mass layoff notices and seizing control of the website
      and freezing agency leadership out of the ability to disburse grants.
- date: 2025-01-28
  title: Education
  text: >-
      DOGE reportedly arrives at the Department of Education. This team is swiftly granted access
      to sensitive datasets on financial aid recipients and reportedly is feeding sensitive data
      into an AI system located in Microsoft's Azure cloud.
- date: 2025-01-28
  title: A Fork in the Road
  text: >-
      Copying a tactic that Elon Musk used at Twitter, all federal employees are sent an email
      titled "A Fork in the Road" which offered them the chance to resign and be paid for six
      months of work. Rolled out without any planning or announcements, it is unclear to many
      recipients if this offer is legal and would be honored by the DOGE team or OPM. It's also
      unclear how the enrollment mechanism of replying to the email with a single word "resign"
      could count legally as a signature.
- date: 2025-01-30
  title: DOGE arrives at SSA
  text: >-
      A random mid-level employee, Leland Dudek, informs the director of facilities and security
      at the Social Security Administration that DOGE will be onboarding the next day. The
      following day, Mike Russo is named the new CIO of the agency. advocate for Akash Bobba to
      be onboarded immediately without a background check.
- date: 2025-01-31
  title: Locked out at OPM
  text: >-
      Federal staff at OPM discover they are now [locked out completely from key
      systems](https://www.reuters.com/world/us/musk-aides-lock-government-workers-out-computer-systems-us-agency-sources-say-2025-01-31/)
      at the agency, due to the actions of DOGE staff and OPM leadership.
- date: 2025-02-03
  title: Feeding USAID into "the wood chipper"
  text: >-
      Elon Musk kicks off a series of tweets against USAID claiming it is "time to die." Staff
      receive an email from Gavin Kliger informing them the building is closed indefinitely and
      that they are all suspended indefinitely the following day.
- date: 2025-02-04
  title: NOAA and the EPA
  text:
      One of the wreckers from OPM, Nikhil Rajpal, is spotted visiting the headquarters of NOAA
      in Silver Spring, MD and is reportedly granted admin access to the agency's Google Drive.
      Meanwhile, Cole Killian is spotted in a staff directory at the EPA.
- date: 2025-02-05
  title: '"Just Do It"'
  text:
      DOGE staff (including Adam Ramada) arrive at Department of Labor, where staff have been
      told by agency leadership that they are to do whatever DOGE asks for, to not push back, and
      to not ask questions. They were told to provide access to any DOL system they requested
      access to and not to worry about any security protocols. "Just do it" is the command.
- date: 2025-02-06
  title: '"I was racist before it was cool"'
  text:
      After the _Wall Street Journal_ identified multiple racist tweets that he posted in the
      September 2024 onwards, [Marko Elez suddenly resigned from his post in the
      Treasury](https://www.npr.org/2025/02/06/nx-s1-5289337/elon-musk-doge-treasury). However,
      both Elon Musk and JD Vance promise to hire him back and he is appointed to a new (and
      probably paid) position at the [Department of Labor](/agencies/labor), from where he has
      since been detailed to multiple agencies to examine many sensitive datasets.
- date: 2025-02-07
  title: '"RIP CFPB"'
  text:
      A wrecking crew including Luke Farritor, Gavin Kliger, Jordan Wick and Chris Young
      arrives at the Consumer Financial Protection Bureau, where they are onboarded and given
      access to systems for HR and procurement as part of their "IT modernization" efforts. Once
      there, Elon Musk tweets "RIP CFPB" and DOGE staff are given superuser admin access by
      orders of Russell Vought to multiple systems including one that lets them grant themselves
      access to any system. Using that access, they delete the homepage of the CFPB website. The
      homepage has not been restored to this day. They also place all employees on administrative
      leave, close the building and start cancelling contracts.
- date: 2025-02-09
  title: Full Control at USAID
  text: >-
      Gavin Kliger and Luke Farritor completely lock USAID staff out of the payments system used
      by the agency, letting them freeze spending on all grants. This sudden cessation of funding
      makes them directly responsible for [the deaths of hundreds of thousands of people
      worldwide](https://www.washingtonpost.com/opinions/2025/02/24/musk-doge-usaid-cuts-dc/) who
      relied on USAID for food or medical interventions. Elon Musk later denies anybody was
      harmed.
- date: 2025-02-10
  title: Arrival at DHS and HUD
  text: >-
      Edward Coristine and Kyle Schutt arrive at the Department of Homeland Security, the first
      of many DOGE staffers who will be detailed to the agency (and spotted within its various
      subsidiary agencies) in the months ahead. At the Department of Housing and Urban
      Development, employees receive emails from Scott Langmack asking them to list every
      contract and review if it is critical or has DEI components.
- date: 2025-02-14
  title: Massacre Averted
  text: >-
      In an attempt to outrace a temporary restraining order from being granted, Jordan Wick
      orders HR staff to work on an immediate large-scale Reduction in Force (RIF) at the CFPB.
      They fail at that goal, and the judge later cites this apparent attempt to subvert her
      ruling to submit a sweeping preliminary injunction against CFPB leadership that prevents
      layoffs.
- date: 2025-02-14
  title: Massacres Accomplished
  text:
      Approximately 50 members (or about a third of the staff that was in USDS before DOGE) are
      summarily fired, with most of the terminations focused on project managers and designers.
      Across the government, many probationary workers have received termination notices.
- date: 2025-02-16
  title: Acting Commissioner Dudek
  text:
      After a weekend where she placed Leland Dudek on disciplinary leave for inappropriate
      actions assisting DOGE, the current acting commissioner of SSA is informed by the that she
      has been terminated and that Leland Dudek is the new acting commissioner.
- date: 2025-02-17
  title: SpaceX at the FAA
  text:
      Four engineers from the Musk-owned company SpaceX are granted 4-day ethics waivers to
      work at the FAA and consult on replacing a communications contract for Verizon with
      Starlink. It's unclear if they actually have stopped working at the agency.
- date: 2025-02-19
  title: More Powers for DOGE
  text: >-
      Donald Trump issues two executive orders that expand the involvement of DOGE in government
      operations. One of them instructs them to work on immigration data collection and the
      second gives them input and control over deregulatory efforts.
- date: 2025-02-19
  title: Attacking Independent Agencies
  text: >-
      With an executive order mandating that IAF, USADF and the USIP must be reduced to their
      smallest statutory footprint, Trump kicks off a monthslong effort of DOGE teams (usually
      led by Nate Cavanaugh) [targeting independent agencies to browbeat them into access and
      then shut them down](/agencies/independent).
- date: 2025-02-26
  title: Contracting Control
  text: >-
      In another executive order, Trump mandates that the DOGE representative at agencies will
      have veto power over awarding any contract and also freezes the use of purchase cards (used
      for small purchases and travel) for 90 days
- date: 2025-02-26
  title: Her?
  text: >-
      After days of sustained questioning both in court cases and by the press, the Trump
      administration finally reveals that the DOGE Administrator is Amy Gleason, a USDS employee
      working at HHS and who is also conveniently on vacation in Mexico at the time of the
      announcement.
- date: 2025-03-01
  title: 18F Eliminated
  text: >-
      Just weeks after praising the talent of the tech team in 18F within the GSA, TTS
      Administrator Thomas Shedd effectively fires every member of the team and takes the 18F
      website and its useful guides for civic technology offline.
- date: 2025-03-05
  title: DOGE? Never Heard of It
  text: >-
      As part of its ongoing efforts to avoid FOIA or legally mandated disclosure, DOGE starts
      hiring staff as full-time employees at individual agencies, with Jordan Wick starting at
      CFPB and Amy Gleason and Brad Smith at HHS
- date: 2025-03-13
  title: JUST DOGE
  text: >-
      Multiple DOGE staffers are reported at the Department of Justice, joining Justin Monroe who
      had been at the FBI since early January. Attorney General Pam Bondi announces she is
      forming a "JUST DOGE" team to restructure the agency.
- date: 2025-03-13
  title: Disruption at IRS
  text: >-
      After weeks of rebuffing efforts by DOGE to share highly sensitive IRS data with other
      agencies, the Acting Counsel of the IRS is removed from his office and replaced by an
      acting counsel who is seen as more sympathetic to DOGE
- date: 2025-03-15
  title: '"Bloody Saturday"'
  text: >-
      After Trump issues a second executive order [targeting the funding at more independent
      federal agencies](/agencies/independent/), his acting head at the US Agency for Global
      Media places [nearly all staffers at the Voice of America on administrative leave and
      cancels all funding for Radio Free Europe and Radio Free
      Asia](https://www.npr.org/2025/03/15/nx-s1-5329244/bloody-saturday-voiceofamerica-radio-free-asia-europe-trump-kari-lake).
- date: 2025-03-20
  title: DOGE? Never Heard of It (reprise)
  text: >-
      During a town-hall at GSA, the acting administrator Stephen Ehikian [claims there is nobody
      from DOGE working at the
      agency](https://www.wired.com/story/elon-musk-doge-mystery-general-services-administration/).
      At the time, there are at least a dozen affiliated DOGE staffers employed by GSA and they
      have a special floor allocated to them in the building.
- date: 2025-03-20
  title: Eliminating Information Silos
  text: >-
      Trump issues an executive order demanding that all executive agencies must immmediately
      support ["authorizing and facilitating both the intra- and inter-agency sharing and
      consolidation of unclassified agency
      records"](https://www.whitehouse.gov/presidential-actions/2025/03/stopping-waste-fraud-and-abuse-by-eliminating-information-silos/)
      with agency heads or anybody authorized by them. Although DOGE isn't explicitly mentioned,
      this is a "give DOGE everything they ask for" instruction, which even included an explicit
      command that the Department of Labor must share a sensitive dataset belonging to the
      Inspector General's office. The order also commands agency heads to provide "unfettered
      access" to data collected from states participating in federal programs.
- date: 2025-03-25
  title: Free Building
  text: >-
      After getting himself declared the head of the agency and forcing everybody into
      administrative leave, Nate Cavanaugh (as the newly declared President of the USIP) gets in
      contact with Stephen Ehikian, the head of GSA (which, coincidentally, employs Nate
      Cavanaugh) about transferring ownership of their building to the GSA. This action is later
      struck down by a judge in court, but the sheer audacity of it is really something.
- date: 2025-03-25
  title: DOGE control of payments
  text: >-
      Trump issues an executive order which mandates that all agencies must make payments through
      the Treasury (rather than directly) and that they must also treat data sharing with
      Treasury as "routine use" and not acknowledge any privacy implications of it.
- date: 2025-03-25
  title: Voting Control
  text: >-
      In another executive order, Trump demands that every state must share its voter
      registration lists and other records with DOGE for their use. This order is possibly in
      violation of the Tenth Amendment.
- date: 2025-03-27
  title: DOGE Control of Payroll
  text: >-
      After a protracted internal struggle which includes the suspension of the agency's CIO,
      Deputy CIO and Chief Counsel, the acting Head of Human Capital and DOGE member Stephanie
      Holmes is granted admin control over FPPS, a shared system managed by the Department of the
      Interior that handles payroll for approximately half of the federal government.
- date: 2025-03-27
  title: '"The Number is 40 percent"'
  text: >-
      After Aram Mohgaddassi scrambles a statistic in an TV interview and [mistakenly claims that
      40% of all calls to Social Security are
      fraud](https://www.nytimes.com/2025/06/16/us/politics/doge-social-security.html), the claim
      gets repeated by Elon Musk and other conservative commentators. SSA readie a public
      statement to correct the error but are told directly by Katie Miller that "the number is 40
      percent. Do not contradict the president."
- date: 2025-04-07
  title: Data Sharing from SSA
  text: >-
      After expressing some qualms about its content, Leland Dudek signs two memos that authorize
      data sharing of highly sensitive social security information with DHS and instance.
- date: 2025-04-08
  title: A "Mega API"
  text: >-
      A week after eliminating a large number of senior technical staff at the IRS, DOGE
      assembles the remaining to kick off [a week-long hackathon to create a "Mega
      API"](https://www.wired.com/story/palantir-doge-irs-mega-api-data/) for other agencies to
      access tax information. The legality of a real system for this is highly dubious.
- date: 2025-04-08
  title: Weaponizing the Death File
  text: >-
      Over the strong objections of agency staff at SSA who were immediately sidelined, Aram
      Mohgaddassi runs a script to add the names of [6300 living immigrants to the Master Death
      Records](https://www.nytimes.com/2025/04/10/us/politics/migrants-deport-social-security-doge.html),
      with the idea that it would make their lives so difficult that they would "self-deport."
      The list include 7 children.
- date: 2025-04-11
  title: Immigration Task Force
  text: >-
      Politico reveals the existence of a DOGE-directed immigration task force that is located
      within DHS but collects data from other agencies like the IRS and SSA and is assembling a
      large surveillance system for that end.
- date: 2025-04-12
  title: DOGE Control of Grants
  text: >-
      Luke Farritor is granted admin control of Grants.gov, a system hosted at HHS and used by
      multiple agencies for managing grants programs. This lets him unilaterally cancel any
      grants without opposition or direction from government staff and leadership.
- date: 2025-04-16
  title: A Gold Card Visa
  text: >-
      Reports identify that DOGE staffers Edward Coristine, Marko Elez and Joe Gebbia are working
      on an interagency effort of DHS, USCIS and the State Department to rush out an application
      form for a $5 Million "Gold Card" immigration visa.
- date: 2025-04-17
  title: Massacre Retried
  text: >-
      After an appeals court ruling allowed for the possibility of some staffing reductions at
      the CFPB, agency leadership under Russell Vought attempts to fire all but ~200 people of
      the ~1400 who work at the agency. This is immediately revoked by the judge who granted the
      initial preliminary injunction. In court testimony, one HR representative describes being
      forced to work for 36 straight hours while being screamed at by Gavin Kliger.
- date: 2025-04-17
  title: Grants at Interior
  text: >-
      After being granted increasingly important roles at the Department of Interior, oil
      executive and DOGE member Tyler Hassen starts reviewing all grants given by the agency.
- date: 2025-04-18
  title: An Immigration Panopticon
  text: >-
      A report in _Wired Magazine_ reveals that [DOGE is building a master database to track and
      surveil
      immigrants](https://www.wired.com/story/doge-collecting-immigrant-data-surveil-track/) fed
      by data from multiple agencies. This includes Social Security Administration, the IRS and
      even voting file information from Pennsylvania and Florida. The goal is to amass a
      centralized data store that would allow them to track immigrants in realtime for capture
      and deportation.
- date: 2025-04-22
  title: Nope to Science from Farritor
  text: >-
      Luke Farritor arrives at the National Science Foundation with a team of other DOGE staffers
      to put all grants through a secondary round of review. He is granted a high-level clearance
      that allows him to view and modify the agency's grants data.
- date: 2025-04-24
  title: '"National Garden of American Heroes"'
  text: >-
      Two weeks after DOGE took over the agency, placed all staff on leave and cancelled a large
      number of existing grants to humanities organizations, the National Endowment for the
      Humanities posts a massive single solicitation of grants for artists to contribute
      sculptures for a "National Garden of American Heroes"
- date: 2025-05-07
  title: The "Trump Card" Visa
  text: >-
      A few months after Trump floated the idea in a meeting, the first evidence emerges showing
      that a DOGE team led by Edward Coristine and Marko Elez is [preparing to launch a sign-up
      system for a $5 Million "Trump Gold Card"
      visa](https://www.wired.com/story/doge-trump-gold-visa-program-immigration/).
- date: 2025-05-13
  title: Stay in Your Lane
  text: >-
      After having harrassed a large number of [small independent federal
      agencies](/agencies/independent), DOGE reaches out to the Government Accountability Office
      to request they meet about assigning a DOGE team to oversee their operations. One small
      problem though: GAO is a legislative branch agency. Their request is denied.
- date: 2025-05-29
  title: Leadership Exodus?
  text:
      After Elon Musk discloses that he is leaving government to return to his struggling
      companies, there is an exodus of DOGE leadership with Katie Miller and James Burnham
      departing from DOGE itself, and married partners Steve Davis and Nicole Hollander leaving
      GSA.
- date: 2025-06-05
  title: Falling Out
  text:
      After a few days of bickering and setbacks, including the retraction of a Musk ally Jared
      Isaacman's nomination to be head of NASA, Trump and Musk have a public falling out. Both
      men spend the afternoon and evening exchanging insults and taunts on their respective
      social media platforms, as DOGE staff start to wonder if they could be easily purged from
      the government themselves. Trump and Musk eventually reconcile after a few days, with Musk
      stating he has "regrets" about his posts linking Trump to the late pedophile and sex
      trafficker Jeffrey Epstein.
- date: 2025-06-07
  title: The Silent treatment
  text: >-
      Despite having left DOGE the week before, Steve Davis keeps trying to run DOGE from inside
      of GSA with the support of Stephen Ehikian and Josh Gruenbaum. DOGE staff are ordered by
      the White House to disregard his instructions, leading to an internal conflict that leads
      to [several DOGE staffer being fired and others removed by Davis from the team's secret
      Signal
      chats](https://www.politico.com/news/2025/07/14/doge-lead-steve-davis-did-not-go-quietly-00452257).
- date: 2025-06-10
  title: Medicaid Data into the Panopticon
  text: >-
      HHS Secretary Robert. F. Kennedy, Jr. authorized [sharing data from several states that
      allow immigrants to enroll in Medicaid with the immigration surveillance
      system](https://apnews.com/article/medicaid-deportation-immigrants-trump-4e0f979e4290a4d10a067da0acca8e22)
      being built by DHS. This approval came over the objection of senior Medicaid staff that
      such sharing probably breaks federal laws and agency norms.
- date: 2025-06-13
  title: Trump Card Site Launches
  text: >-
      Following on early reports that a DOGE team had been working on the internal infrastructure
      at USCIS to support a $5 Million immigration visa, DOGE launches a site
      [trumpcard.gov](https://trumpcard.gov/) with a signup form for people who are interested in
      enrolling. It also includes an email address for the Department of Commerce. They claim to
      have 15,000 sign-ups, but it's unclear how many of these are serious customers.
- date: 2025-06-14
  title: DOGE launches a "Greatest Hits" page
  text: >-
      DOGE makes an update to its site to include a ["Greatest Hits"
      page](https://doge.gov/greatest-hits) highlighting the grants and contracts they think are
      the most laughable. The common denominator? Most of them [mention that the money benefits
      minority
      groups](https://www.notus.org/trump-white-house/doge-greatest-hits-thomasville-georgia).
      The DOGE site still continues to lack text search.
- date: 2025-07-01
  title: Using AI to Slash Regulations
  text: >-
      DOGE staffers deliever a presentation for [a project that will use AI to eliminate roughly
      50% of federal
      regulations](https://www.washingtonpost.com/business/2025/07/26/doge-ai-tool-cut-regulations-trump/)
      that DOGE deems are not backed by statute, with the goal of eliminating them by January 20,
      2026. In their presentation, DOGE claims the tool has already made determinations on 1083
      decisions at HUD (using Christopher Sweet's work) and has also been used for 100% of
      deregulatory actions at the CFPB.
- date: 2025-07-17
  title: Assembling the Surveillance Machine
  text: >-
      CMS announces that it will be sharing [data on 79 million Medicaid
      enrollees](https://apnews.com/article/immigration-medicaid-trump-ice-ab9c2267ce596089410387bfcb40eeb7)
      with Immigration and Customs Enforcement (ICE), so that they can use the data, which
      includes home addresses and ethnicities, to target people for arrest and deportation. This
      follows reports of ICE also seeking information on [7.3 million taxpayers from the
      IRS](https://www.propublica.org/article/trump-irs-share-tax-records-ice-dhs-deportations),
      leading to resignations and refusals at that agency.
- date: 2025-07-18
  title: Codifying Some DOGE Cuts
  text: >-
      Over the objections of Democrats and a few Republicans, [Congress passes a $9 billion
      recissions
      package](https://www.npr.org/2025/07/18/nx-s1-5469912/npr-congress-rescission-funding-trump)
      that formalizes DOGE clawbacks of foreign aid form USAID and State as well as the
      elimination of funding for the Corporation for Public Broadcasting. The same day, Russell
      Vought tells a Congressional oversight committee that the White House is going to simply
      [refuse to release an annual budget in the near
      future](https://www.washingtonpost.com/business/2025/07/17/white-house-budget-vought/) and
      that it will continue to disregard the normal bipartisan Congressional budget process.
- date: 2025-08-03
  title: Voter Registrations Inquiry
  text: >-
      At least 19 states confirm that the Department of Justice has requested their voter registration
      lists for the 2020 and 2024 elections. Traditionally, states have not shared data on elections
      with the federal government and there are legitimate concerns that this data could be used in
      administration disinformation to proclaim there is widespread voting fraud. This effort echoes
      a claim made back in May by Antonio Gracias that DOJ had asked DOGE to find “10-20 cases of alleged noncitizen voting in every state.”
- date: 2025-08-06
  title: '"Five Things" Goes Away'
  text: >-
      Months after it was frantically launched in February after Elon Musk went on a tweetstorm
      threatening that all federal staff must mail in a list of "five things" they did over the
      past week or be fired, the email requirement is quietly killed by new OPM. New
      administrator Scott Kupor backed the move with the statement "At OPM, we believe that
      managers are accountable to staying informed about what their team members are working on
      and have many other existing tools to do so." It is unclear if anybody even looked at the
      emails that were collected over the past 6 months, and many agencies chose not to
      participate at all.
- date: 2025-08-08
  title: The IRS Shares Data With DHS
  text: >-
      After several months of rebuking DHS requests to share data on millions of taxpayers into the large anti-immigration data lake
      within DHS, IRS commissioner Billy Long is removed from his position – he was the sixth IRS commissioner this year. This is followed
      by a request for records on up to 1.23 million individuals, a massive expansion over the original scope of the MOU that stated
      data sharing would only apply to immigrants under active criminal investigation.
- date: 2025-08-13
  title: SweetREX
  text: >-
      Scott Langmack hosts a call with multiple agencies to demonstrate a tool developed by college student Christoper Sweet
      at HUD which can be used to identify regulations to be eliminated and rewritten. Agency representatives from the
      Environmental Protection Agency, the Department of State, and the Federal Deposit Insurance Corporation are on the call,
      as is also Steve Davis, despite him having left DOGE at the end of May.
- date: 2025-08-21
  title: National Design Studio
  text: >-
      Trump signs EO 14338, "Improving Our Nation Through Better Design," which creates a new office within the
      White House named the National Design Studio, which will be responsible for centralizing and standardizing
      design across the federal government. Observers noted that the EO defined a temporary organization within the NDS
      in a similar way to DOGE, and the connection between the two was confirmed when Joe Gebbia was named as the
      Chief Design Officer for the new organization. They also launched two websites for the [National Design Studio](https://ndstudio.gov)
      and [America By Design](https://americabydesign.gov) that copied the same style of DOGE's other two existing websites. Although the EO
      does direct the Chief Design Officer to update the existing US Web Design System, there was
      no mention of accessibility or hiring back the many skilled designers who were laid off by
      DOGE.
- date: 2025-08-26
  title: DOGE's SSA Cloud
  text: >-
      A whistleblower goes public with accusations that DOGE bypassed agency regulations and sidelined career officials at
      the Social Security Administration to upload a copy of all social security numbers to a private cloud environment outside
      of the usual security controls and oversight. The whistleblower, Charles Borges, who was the Chief Data Officer at the agency
      is then forced to resign from his position a few days later due to reported retaliation.
- date: 2025-09-03
  title: A Few Big Departures
  text: >-
      Within a day of each other, two important [enablers](/people/enablers) are reported to be leaving the government.
      At GSA, Stephen Ehikian announces he is phasing out of his role to become the CEO of an AI startup. Although he had
      been an important ally for DOGE's activities at the agency and across the government, he had also sided with Steve
      Davis in his failed attempt to keep running DOGE after leaving government service. Over at OPM, Greg Hogan is
      reported to be leaving his role of CIO, ending DOGE's extended control of IT operations at the agency since January 20th.
- date: 2025-09-09
  title: Pocket Recissions
  text: >-
      Supreme Court Chief Justice John Roberts issues an administrative stay that blocks an order by a lower court for the
      Trump administration to immediately pay out $4 billion in funds appropriated by Congress for foreign aid. He promises that the
      court will hear out the legality of so-called "pocket recissions" in the upcoming term, but this move essentially allows the
      Trump administration to immediately impound any funds it does not want to see spent, further imperiling the separation of
      powers and making it unlikely that Democrats would want to pass a continuing budget resolution without legal language to
      prevent such recissions.
- date: 2025-09-17
  title: Demands for Voter Data
  text: >-
      The Department of Justice sues the states of Maine and Oregon for refusing to comply with EO 14248, which demanded that
      all states must supply their voter registration data to the government for the 2020 and 2024 elections. Several states have
      refused to do this, citing concerns about privacy, possible improper ways in which the data might be used and the big question
      about whether the order is unconstitutional. The administration expands litigation against five more states – Pennsylvania, Michigan,
      Minnesota, New York, and New Hampshire – a few days later for also refusing to comply. With the exception of New Hampshire, all are states
      led by Democratic governors.
- date: 2025-09-20
  title: A Revamped Gold Card Visa
  text: >-
      The Department of Commerce relaunches the signup website for the "Trump Card" Gold Visa that would allow applicants to purchase
      an immigration visa. The cost of the visa is reduced from $5 million to $1 million, and the visa type is changed to be the
      existing EB-1 and EB-2 visas instead of a new category. This move sidesteps the dubious legality of the President unilaterally
      creating a new type of visa, but it now exposes the program to litigation from existing visa applicants against this option for
      rich people to skip the line. The new website is still a single-page email sign-up form, but now it touts a banner that it was
      created by the National Design Studio.
- date: 2025-09-25
  title: '"Unchecked and Unaccountable"'
  text: >-
      Democratic members of the Senate Homeland Security and Intergovernmental Affairs Committee release a comprehensive report
      titled [Unchecked and Unaccountable: How DOGE Jeopardizes Americans' Data Without Regard for Law and Congress](https://www.hsgac.senate.gov/wp-content/uploads/DOGE_REPORT_FINAL_7.pdf) which details
      DOGE activities at the Social Security Administration, GSA and OPM. It also notably includes multiple examples of agency
      leadership and DOGE staff attempting to block and undermine oversight visits from Senate staffers.
- date: 2025-10-01
  title: DOGE in the Shutdown
  text: >-
      After an impasse in the Senate blocks a continuing budget resolution, the US government enters an extended shutdown, with
      non-essential functions and staff furloughed. Prior to this moment, the Trump administration had threatened that a shutdown
      would mean "DOGE 2.0" and they followed up over the next few days with Russell Vought withholding important grants to
      multiple states controlled by Democratic governors. This came after the White House initially dismissed Democratic concerns
      that a budget agreement would be useless if the administation could just unilaterally cancel appropriated funds later.
- date: 2025-10-07
  title: Another DOGE Leader Exits
  text: >-
      Anthony Armstrong is named as the new CFO for xAI. Armstrong had been identified by Sahil Lavingia as one of the three individuals
      who was secretly running DOGE, and he was the only one left after Steve Davis' departure in May. Of course, xAI is a company
      owned by Elon Musk, and this is another prominent example where DOGE staffers are rewarded for their work with plum
      positions within DOGE-affiliated tech companies.
- date: 2025-10-30
  title: A Flurry of Activity
  text: >-
      After weeks of relative silence, multiple DOGE-related actions indicate some new directions for the holdovers. The
      National Design Studio registers a domain [techforce.gov](https://techforce.gov/), whatever that will be. Perhaps related,
      DOGE-affiliated staff in the Department of Defense push for an expansion of the military's drone programs, while the
      head of naval research is removed and replaced by Rachel Riley.
- date: 2025-11-23
  title: '"DOGE Doesn''t Exist"'
  text: >-
      Based on comments made by OPM head Scott Kupor in an interview, Reuters reports that DOGE has disbanded months ahead of its planned
      end on July 4, 2026. Instead, DOGE has become decentralized, with many of its goals now being driven by agency leadership.
      Even if nominally true for the OPM, there are still many DOGE staff across the federal government that are carrying on the mission
      and the National Design Studio is a new home for embedded Special Government Employees.
- date: 2025-12-10
  title: '"A little bit successful"'
  text: >-
      Appearing on the podcast of fellow DOGE alumna Katie Miller, Elon Musk says that DOGE [was only a little bit successful](https://www.bbc.com/news/articles/c80x35dek82o)
      and that if he could do it all over again, then he probably wouldn't because he wasn't prepared for the effect it
      had on Tesla sales.
- date: 2025-12-15
  title: Tech Force Launches
  text: >-
      The National Design Studio launches a site in collaboration with OPM for a new initiative called [Tech Force](techforce.gov), wherein
      tech companies will support junior engineers to take a 2-year rotation within the government before returning back to their own companies.
      It sounds similar to the shuttered 18F and USDS programs which also featured 2-year rotations but no guarantees of a job to return to and
      which were mainly staffed by senior engineers. It also sounds similar to the existing [US Digital Corps](https://digitalcorps.gsa.gov/) program
      of GSA, but with staff only supplied from specific tech companies.
