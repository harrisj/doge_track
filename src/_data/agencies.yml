  doge_base: true
  blurb: "Created in the wake of the September 11 attacks, the Department of Homeland Security is a massive agency which contains a variety of agencies
    concerned with law enforcement, immigration, disaster response and even cybersecurity. \nDHS contains the following agencies where DOGE has had linked
    activities: - **Customs and Border Patrol (CPB)**: the agency that secures America's border (and can act 100 miles within from any of those borders).
    This is also the agency that collects tariff duties. - **Cybersecurity & Infrastructure Security Agency (CISA)**: a centralized clearinghouse and coordinator
    for defense of America's physical and network infrastructure. This is also the agency that must be notified when breaches of government systems occur.
    - **Federal Emergency Management (FEMA)**: the agency for coordinating federal responses to natural disasters - **Immigration and Customs Enforcement
    (ICE)**: the agency that handles immigration arrests. The Trump administration is looking to dramatically expand its size and scope for detentions and
    deportations. - **Transportation Security Administration (TSA)**: this agency handles security at airports. DOGE is reportedly involved with activities
    in this agency, but there are no details on this. - **US Citizenship and Immigration Services (USCIS)**: the agency that supports legal immigration
    and naturalization to America has been targeted by DOGE for reductions and to create a new $5 million immigration visa."
