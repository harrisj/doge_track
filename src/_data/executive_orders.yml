- id: 14248
  title: Preserving and Protecting the Integrity of American Elections
  date: '2025-03-25'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14248-preserving-and-protecting-the-integrity-american-elections
  summary: >-
    This order attempts to assert greater federal control over the voter registration process for each state towards verifying that only citizens are voting
    (a frequent trope in anti-immigrant rhetoric on the right wing despite the lack of any evidence it happens regularly). To that end, it lays out some
    requirements for states that have triggered lawsuits for overreach``. It also directs that the Social Security Administration to make available to state
    and local officials the "Social Security Number Verification Service, the Death Master File, and any other Federal databases" for use in verifying individuals.
    It also directs DHS to work with DOGE on reviewing the voter registration lists for each state against immigration records in the idea that they will
    be able to identify patterns of illegal voting. And it threatens to withhold election funds from the FEC for any state that refuses to comply.
  all_agencies: true
