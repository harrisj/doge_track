- id: 14271
  title: Ensuring Commercial, Cost-Effective Solutions in Federal Contracts
  date: '2025-04-15'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14271-ensuring-commercial-cost-effective-solutions-federal-contracts
  summary: >-
    This executive order specifically constrains the ability of the federal government to create custom software, by mandating that any proposed procurement
    for custom development work must include a justification for why it couldn't be handled by an off-the-shelf product and must get explicit approval from
    agency leadership (and probably DOGE staff) to proceed. This would be a boon to Silicon Valley firms like Oracle, Salesforce or Palantir while also
    diminishing the ability of agencies to own the systems they operate, restoring the perpetual licensing-fee treadmill that has plagued many agency IT
    operations.
  all_agencies: true
