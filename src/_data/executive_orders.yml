- id: 14243
  title: Stopping Waste, Fraud, and Abuse by Eliminating Information Silos
  date: '2025-03-20'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14243-stopping-waste-fraud-and-abuse-eliminating-information-silos
  summary: >-
    This order was designed to formalize the widespread data access that DOGE has already demanded from agencies. Claiming it is motivated by a desire to
    eliminate information silos, it ordered that agencies must make all efforts to ensure that agency heads or their designees (i.e., DOGE) must have full
    access to any unclassified data that they request. Furthermore, they must be given access to any data provided by states that participate in federal
    programs. It also included a specific instruction that the Secretary Labor (or his designee) should have access to unemployment records that belonged
    to their Inspector General, a direct granting of access to a dataset that DOGE had been coveting.
  all_agencies: true
