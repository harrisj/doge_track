  link: https://www.presidency.ucsb.edu/documents/executive-order-14240-eliminating-waste-and-saving-taxpayer-dollars-consolidating
  summary: >-
    This executive order directed agencies to submit plans within 60 days of how their procurement could instead be conducted by GSA instead of by the agency
    itself. It also designated the Administrator of the GSA as the executive agent for any government-wide acquisition contracts (GWAC) for IT. This means
    that the GSA becomes the sole entity to negotiate and/or continue IT contracts for software and services at various agencies. Although this order does
    not explicitly mention DOGE, the GSA's technology division is heavily controlled by DOGE and the GSA Administrator, Stephen Ehikian, is considered a
    DOGE associate.
