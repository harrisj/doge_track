- id: 14222
  title: Implementing the President's "Department of Government Efficiency" Cost Efficiency Initiative
  date: '2025-02-26'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14222-implementing-the-presidents-department-government-efficiency-cost
  summary: >-
    This executive order directed all agencies to work with their DOGE teams to build a single centralized system to record all payments made by the agency
    with the requirement that every requested payment must include a brief written justification for the services. It also grants the authority to DOGE
    teams to review all contracts and grants at the agencies and terminate at their discretion any grants they feel don't serve the administration or should
    have their costs recovered. This executive order gave DOGE the justification to demand access to grants in all agencies and set a 30-day deadline to
    support their practice of demanding emergency powers to do so. This order also placed a 30-day freeze on all spending cards (implemented by the GSA
    setting a $1 limit for them) and elimination of all non-essential travel. Finally, this EO commanded all agencies to follow the GSA's lead and terminate
    any unnecessary building leases within 30 days.
  all_agencies: true
  directs_doge: true
