  summary: >-
    This order establishes the administration's targeting of "DEI" as something to be eliminated in the federal government. It includes a directive for
    the head of the OPM to eliminate DEI in hiring practices and federal employment policies. It also includes directives to agencies to eliminate DEI-related
    positions as well as contracts, and a monthly meeting with OPM, OMB and agency heads to report on the costs of social justice measures for their agencies.
