- id: 14284
  title: Strengthening Probationary Periods in the Federal Service
  date: '2025-04-24'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14284-strengthening-probationary-periods-the-federal-service
  summary: >-
    Issued in the wake of preliminary injunctions that found OPM radically overstepped its bounds demanding the indiscriminate termination of probationary
    employees, this executive order proposes a new regulation that would require agencies and employees in probationary periods (ie, in the first year of
    a role, whether as a new hire or promotion) affirm why they should continue to be hired or be automatically terminated. As a result of this ruling,
    federal staff could find themselves promoted into new responsibilities and then fired because their their case for continued employment was not considered
    adequate or the administration wants to reduce headcount.
