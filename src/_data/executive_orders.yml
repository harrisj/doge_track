- id: 14215
  title: Ensuring Accountability for All Agencies
  date: '2025-02-18'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14215-ensuring-accountability-for-all-agencies
  summary: >-
    This executive order laid out the concept that independent agencies that were created as such by Congress are not allowed to be independent and must
    instead report to the President. Furthermore, any regulations they propose must be cleared by the White House's Office of Information and Regulatory
    Affairs (OIRA) within OMB first. It also claims that Federal employees are not allowed to use their own interpretations to determine what actions are
    legal or illegal; instead, the law is what the President or the Attorney General says it is (and since the Trump DOJ had already rejected the independence
    of the AG, this means the law is what the President alone says it is). Needless to say, this has been heavily litigated in court, but it serves as the
    administration's justification for cracking down on independent agencies.
  all_agencies: true
  directs_doge: false
