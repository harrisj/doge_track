- id: 14210
  title: Implementing the President's "Department of Government Efficiency" Workforce Optimization Initiative
  date: '2025-02-11'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14210-implementing-the-presidents-department-government-efficiency
  summary: >-
    This executive order set an benchmark for attrition at various agencies, mandating that agencies can only hire 1 new person if 4 people are removed
    (ie, a 75% reduction). It also tasked agency heads to work with DOGE leads in their agencies to develop "a data-driven plan" for prioritizing new hires
    in the areas of highest need. It also granted the local DOGE team lead with the power to determine if any vacancy should be filled and to veto any potential
    hire into career positions.
  all_agencies: true
