  summary: >-
    This executive order commands the Nuclear Regulatory Commission to reduce its regulatory oversight over the nuclear energy sector, with the goal of
    radically increasing the number of nuclear reactors in America. This would be just another example of the Trump Administration/Project 2025 insistence
