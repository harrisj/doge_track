- id: 14192
  title: Unleashing Prosperity Through Deregulation
  date: '2025-01-31'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14192-unleashing-prosperity-through-deregulation
  summary: >-
    This executive order tasked agencies with reducing regulations by putting caps on their ability to new regulations. Specifically, a new regulation could
    only be proposed if 10 regulations are eliminated, and the projected costs must be zero or negative (by removing other regulations). It's unclear if
    these targets were rigidly enforced (for instance, OPM has been ordered to issue multiple new regulations over the last few months), but it does formalize
    the Project 2025 framing that all regulation is bad with an OKR-style metric for DOGE to enforce.
  all_agencies: true
