- id: 14179
  title: Removing Barriers to American Leadership in Artificial Intelligence
  date: '2025-01-23'
  link: https://www.presidency.ucsb.edu/documents/executive-order-14179-removing-barriers-american-leadership-artificial-intelligence
  summary: >-
    This order revoked Biden-era executive orders and memos on how Artificial Intelligence can be utilized within the government. Those established some
    guardrails to ensure that AI training would not leak data to unauthorized locations, that AI programs would not perpetuate bias, and that AIs would
    not be used to make decisions or determinations until it had been cleared through a pilot program. This executive order does not mention DOGE, but it
    enables their widespread use of AI without needing to follow any of the safeguards of the Biden admininstration.
  all_agencies: false
