                  agency:
                    id: CDC
                    name: Centers for Disease Control and Prevention
                    short_name: CDC
                    parent_id: HHS
                    slug: cdc
                    path: https://dogetrack.info/api/agencies/cdc.json
                  access: []
  /projects.json:
    get:
      summary: projects.json
      description: A list of all of DOGE's major projects
      operationId: getProjects
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectItem'
              example:
                - id: personnel
                  title: Attacking Government Personnel
                  path: https://dogetrack.info/api/projects/personnel.json
                  num_events: 181
                  num_systems: 29
  /projects/{id}.json:
    get:
      summary: projects/{id}.json
      description: Find a project by its ID
      operationId: getProject
      parameters:
        - name: id
          in: path
          description: ID of the project to return
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRecord"
              example:
                id: dei
                title: Targeting DEI
                summary: 'DOGE has been involved in work to eliminate "pro-DEI activities, content and expenditures at government agencies. This has included activities like scrubbing pages from websites and cancelling grants that match certain keywords.'
                path: /projects/dei
                label_text: Anti-DEI
                label_color: primary
                events:
                  - id: "7FBiV0yI"
                    type: interagency
                    date: "2025-01-24"
                    sort_date: "2025-01-24"
                    text: Representing OPM, James Sullivan coordinates in an email to Department of Energy officials on several DOGE-led initiatives. One messages states "as discussed over the phone, when you compile the list of 69 DEI employees placed on admin leave, please share with Amanda and myself." Energy officials also send a list of 1394 probationary employees to Amanda Scales, all of whom will be fired.
                    fuzz: null
                    comment: null
                    case_no: null
                    agencies:
                      - id: OPM
                        name: Office of Personnel Management
                        short_name: OPM
                        parent_id: null
                        slug: opm
                        path: https://dogetrack.info/api/agencies/opm.json
                      - id: Energy
                        name: Department of Energy
                        short_name: DOE
                        parent_id: null
                        slug: energy
                        path: https://dogetrack.info/api/agencies/energy.json
                    sources:
                      - url: https://www.eenews.net/articles/how-the-energy-department-got-doged/
                        title: How the Energy Department got DOGE'd
                        pub_date: "2025-11-07"
                        publisher: E&E News
                        short_publisher: E&E News
                    people:
                      - name: Amanda Scales
                        sort_name: Scales
                        slug: amanda-scales
                        path: https://dogetrack.info/api/people/amanda-scales.json
                      - name: James Sullivan
                        sort_name: Sullivan
                        slug: james-sullivan
                        path: https://dogetrack.info/api/people/james-sullivan.json
                    projects:
                      - id: dei
                        title: Targeting DEI
                        path: https://dogetrack.info/api/projects/dei.json
                      - id: personnel
                        title: Attacking Government Personnel
                        path: https://dogetrack.info/api/projects/personnel.json
                    aliases: []
                systems: []
  /entities.json:
    get:
      summary: entities.json
      description: A list of all of entities with affiliations
      operationId: getEntities
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityItem'
              example:
                - id: airbnb
                  title: AirBnb
                  description: null
