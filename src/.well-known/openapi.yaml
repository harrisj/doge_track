    SourceRecord:
      type: object
      description: Information about a single source
      properties:
        url:
          description: The URL of the source
          type: string
        title:
          description: The title of the source
          type: string
        pub_date:
          description: The publication date of the source (if applicable)
          type: string
          format: date
        publisher:
          description: The publisher of the source
          type: string
        short_publisher:
          description: An abbreviated name for the publisher
          type: string
      required:
        - url
        - publisher
        - short_publisher
    SystemRecord:
      type: object
      description: Represents a single IT system in the government
      properties:
        id:
          description: A unique ID for the system
          type: string
        acronym:
          description:
            An acronym for the system. This may not be unique and might include whitespace and
            punctuation.
          type: string
        name:
          description: The name of the system
          type: string
        type:
          description: The type of the system
          allOf:
            - $ref: "#/components/schemas/SystemType"
        description:
          description: A description for the system
          type: string
        comment:
          description: My non-public comments about the system
          type: string
        category:
          description: A category for the system
          type: string
        population:
          description: A short description of what type of people are in this system
          type: string
        risk:
          description:
            A short description of what sort of risks might happen because of DOGE's access to
            the system
          type: string
        link:
          description: A URL for information about the system
          type: string
        pia:
          description: A link to the Privacy Impact Assessment for the system if known
          type: string
        sorn:
          description: A link to a System of Records Notice (SORN) for the system if known
          type: string
        doge_created:
          description: True if DOGE created this system
          type: boolean
          default: false
        doge_modifications:
          description: A description of modifications that DOGE made to the system if known
          type: string
        projects:
          description: An array of project references for this system
          type: array
          items:
            $ref: "#/components/schemas/ProjectRef"
        agency:
          description: If not part of an Agency record, a reference to what agency this system belongs to.
          allOf:
            - $ref: "#/components/schemas/AgencyRef"
        access:
          description: An array of system access records for this system
          type: array
          items:
            $ref: "#/components/schemas/SystemAccessRecord"
      required:
        - id
        - name
        - type
        - description
    SystemAccessRecord:
      type: object
      description: Represents a single access by a DOGE member against an IT system
      properties:
        id:
          description: A unique identifier for the system access
          type: string
        type:
          description: The type of access being granted
          allOf:
            - $ref: "#/components/schemas/AccessType"
        doge_alias_id:
          description: The DOGE alias of the person granted access, if known
          type: string
        date_requested:
          description: "If known, the date access was requested"
          allOf:
            - $ref: "#/components/schemas/EdtfType"
        date_req_truth:
          $ref: "#/components/schemas/TruthType"
        date_granted:
          $ref: "#/components/schemas/EdtfType"
        date_grant_truth:
          $ref: "#/components/schemas/TruthType"
        ao_name:
          description: The name of the authorizing official granting access
          type: string
        ao_title:
          description: The title of the authorizing official granting access"
          type: string
        ao_office:
          description: The office of the authorizing official
          type: string
        ao_type:
          description: The type of the authorizing official
          allOf:
            - $ref: "#/components/schemas/AoType"
        ao_doge:
          description: Set to true if access was directly authorized by a DOGE member
          type: boolean
        ao_truth:
          $ref: "#/components/schemas/TruthType"
        bypassed:
          description: Set to true if the access was bypassed or not enforced
          type: boolean
        date_last_used:
          description: "The date last used if provided"
          allOf:
            - $ref: "#/components/schemas/EdtfType"
        date_used_truth:
          $ref: "#/components/schemas/TruthType"
        date_revoked:
          description: "The date access was revoked"
          allOf:
            - $ref: "#/components/schemas/EdtfType"
        date_revoked_truth:
          $ref: "#/components/schemas/TruthType"
        date_nte:
          description: "The date access is not to exceed"
          allOf:
            - $ref: "#/components/schemas/EdtfType"
        date_nte_truth:
          $ref: "#/components/schemas/TruthType"
        never_accessed:
          description: Set to true if the grantee was reported to never have accessed the data
          type: boolean
        sources:
          description: The sources for this info
          type: array
          items:
            $ref: "#/components/schemas/SourceRecord"
        comment:
          description: For internal comments
          type: string
        table_note:
          description: Text to include in the display table
          type: string
        person:
          $ref: "#/components/schemas/PersonRef"
        agency:
          description:
            The agency for the access. For SSP and SaaS applications, this might be different
            than the system agency.
          allOf:
            - $ref: "#/components/schemas/AgencyRef"
        system:
          $ref: "#/components/schemas/SystemRecord"
      required:
        - id
        - type
