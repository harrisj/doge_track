          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecord"
              example:
                - id: "1I9c0qJj"
                  type: sighting
                  date: "2024-11-15"
                  sort_date: "2024-11-15"
                  time: null
                  text: 'Elon Musk and Russell Vought meet each other for the first time at Mar-a-Lago. They reportedly got along very well, with "both on the same wavelength in terms of taking the most extreme action possible."'
                  notable: true
