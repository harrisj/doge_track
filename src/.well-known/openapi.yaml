openapi: 3.1.2
info:
  title: DOGE Track API
  description: |-
    This is an API for the data on dogetrack.info. Since it is a series of statically-generated files, there is no API key required!
  termsOfService: https://dogetrack.info/about/this-site/
  contact:
    email: mail@jacobharr.is
  license:
    name: Open Data Commons Attribution License (ODC-By)
    url: https://opendatacommons.org/licenses/by/1-0/
  version: "0.9.0"
externalDocs:
  description: DOGE Track
  url: https://dogetrack.info/
servers:
  - url: https://dogetrack.info/api/
paths:
  /index.json:
    get:
      summary: index.json
      description: An index of the API collections with counts of each collection.
      operationId: getIndex
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiIndex"
              example:
                name: DOGE Track API
                collections:
                  agencies:
                    path: https://dogetrack.info/api/agencies.json
                    count: 85
                  people:
                    path: https://dogetrack.info/api/people.json
                    count: 195
                  events:
                    path: https://dogetrack.info/api/events.json
                    count: 1121
                  systems:
                    path: https://dogetrack.info/api/systems.json
                    count: 116
                  projects:
                    path: https://dogetrack.info/api/projects.json
                    count: 9
                  entities:
                    path: https://dogetrack.info/api/entities.json
                    count: 29
                  aliases:
                    path: https://dogetrack.info/api/aliases.json
                    count: 39
  /aliases.json:
    get:
      summary: aliases.json
      description:
        Information about all the DOGE aliases in the system, including evidence and
        identifications
      operationId: getAliases
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AliasRecord"
              example:
                - id: CFPB-01
                  evidence:
                    - "A declaration from [AFL-CIO vs. DOL](https://storage.courtlistener.com/recap/gov.uscourts.dcd.277150/gov.uscourts.dcd.277150.73.2.pdf) outlines access granted to CFPB staff"
                  person:
                    name: Gavin Kliger
                    sort_name: Kliger
                    slug: gavin-kliger
                    path: https://dogetrack.info/api/people/gavin-kliger.json
                  agency:
                    id: CFPB
                    name: Consumer Financial Protection Bureau
                    short_name: CFPB
                    parent_id: null
                    slug: cfpb
                    path: https://dogetrack.info/api/agencies/cfpb.json
                  name_truth: null
  /agencies.json:
    get:
      summary: agencies.json
      description: A listing of all the agencies in DOGE track with summary information.
      operationId: getAgencies
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgencyItem"
              example:
                - id: ACHP
                  name: Advisory Council on Historic Preservation
                  short_name: ACHP
                  parent_id: null
                  slug: achp
                  path: https://dogetrack.info/api/agencies/achp.json
                  num_events: 2
                  num_positions: 0
                  num_doge: 0
  /agencies/{slug}.json:
    get:
      summary: agencies/{slug}.json
      description: Returns a single agency.
      operationId: getAgency
      parameters:
        - name: slug
          in: path
          description: slug of the agency to return
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyRecord"
              example:
                id: ACHP
                name: Advisory Council on Historic Preservation
                short_name: ACHP
                parent_id: null
                slug: achp
                path: https://dogetrack.info/api/agencies/achp.json
                events:
                  - id: "6sYzWZML"
                    type: official
                    date: "2025-04-17"
                    sort_date: "2025-04-17"
                    text: DOGE contacts the leadership of ACHP requesting a meeting for the following week with a new DOGE team that will be assigned to the agency.
                    fuzz: null
                    comment: null
                    case_no: null
                    agencies:
                      - id: ACHP
                        name: Advisory Council on Historic Preservation
                        short_name: ACHP
                        parent_id: null
                        slug: achp
                        path: https://dogetrack.info/api/agencies/achp.json
                    sources:
                      - url: https://www.npr.org/2025/05/17/nx-s1-5401392/doge-federal-agency-nonprofits-cpb-usip-vera-institute
                        title: DOGE has tried to embed beyond the executive branch. Some targets have pushed back
                        pub_date: "2025-05-20"
                        publisher: National Public Radio
                        short_publisher: NPR
                    people: []
                    projects: []
                    aliases: []
                  - id: "7BTc0SXi"
                    type: sighting
                    date: "2025-04-23"
                    sort_date: "2025-04-23"
                    text: After an initial video call, DOGE representatives arrive at the agency offices of the Advisory Council on Historic Preservation.
                    fuzz: null
                    comment: null
                    case_no: null
                    agencies:
                      - id: ACHP
                        name: Advisory Council on Historic Preservation
                        short_name: ACHP
                        parent_id: null
                        slug: achp
                        path: https://dogetrack.info/api/agencies/achp.json
                    sources:
                      - url: https://www.npr.org/2025/05/17/nx-s1-5401392/doge-federal-agency-nonprofits-cpb-usip-vera-institute
                        title: DOGE has tried to embed beyond the executive branch. Some targets have pushed back
                        pub_date: "2025-05-20"
                        publisher: National Public Radio
                        short_publisher: NPR
                    people: []
                    projects: []
                    aliases: []
                positions: []
                details_from: []
                systems: []
  /events.json:
    get:
      summary: events.json
      description: Returns all events
      operationId: getEvents
      responses:
        "200":
          description: "Successful return"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRecord"
              example:
                - id: "1I9c0qJj"
                  type: sighting
                  date: "2024-11-15"
                  sort_date: "2024-11-15"
                  time: null
                  text: 'Elon Musk and Russell Vought meet each other for the first time at Mar-a-Lago. They reportedly got along very well, with "both on the same wavelength in terms of taking the most extreme action possible."'
                  notable: true
                  fuzz: null
                  comment: null
                  case_no: null
                  system_id: null
                  people:
                    - name: Elon Musk
                      sort_name: Musk
                      slug: elon-musk
                      path: https://dogetrack.info/api/people/elon-musk.json
                  agencies:
                    - id: DOGE
                      name: Department of Government Efficiency
                      short_name: DOGE
                      parent_id: EOP
                      slug: doge
                      path: https://dogetrack.info/api/agencies/doge.json
                  sources:
                    - url: https://www.propublica.org/article/russ-vought-trump-shadow-president-omb
                      title: The Shadow President
                      pub_date: "2025-10-17"
                      publisher: Pro Publica
                      short_publisher: ProPublica
                  projects: []
                  aliases: []
  /people.json:
    get:
      summary: people.json
      description: A listing of all the people in DOGE Track with summary information.
      operationId: getPeople
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonItem"
              example:
                - name: Aaron Jackson
                  sort_name: Jackson, Aaron
                  slug: aaron-jackson
                  path: https://dogetrack.info/api/people/aaron-jackson.json
                  skill: designer
                  govt_start_date: "2025-09-01"
                  govt_exit_date: null
                  num_events: 0
                  num_positions: 1
                  agencies:
                    - id: NDS
                      name: National Design Studio
                      short_name: NDS
                      parent_id: null
                      slug: nds
                      path: https://dogetrack.info/api/agencies/nds.json
                  systems_accessed: []
  /people/{slug}.json:
    get:
      summary: people/{slug}.json
      description: Find a person by their slug
      operationId: getPerson
      parameters:
        - name: slug
          in: path
          description: slug of the person to return
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonRecord"
              example:
                name: Branden Spikes
                sort_name: Spikes
                slug: branden-spikes
                association: possible
                custom_path: null
                age: null
                skill: coder
                own_page: false
                blurb: A longtime associate of Elon Musk at Twitter and other companies, Branden Spikes reportedly spent a couple of months within DOGE, but there are no public details yet.
                reporting_notes: null
                comment: null
                govt_exit_date: null
                govt_exit_truth: null
                govt_exit_type: null
                table_note: null
                tech_links: null
                linkedin: https://www.linkedin.com/in/brandenspikes/
                college_graduation_year: null
                aliases: []
                events: []
                positions: []
                systems_accessed: []
                affiliations: []
  /systems.json:
    get:
      summary: systems.json
      description: A listing of all the systems in DOGE Track.
      operationId: getSystems
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
