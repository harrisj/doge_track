                      path: https://dogetrack.info/api/projects/spending.json
                  agency:
                    id: CDC
                    name: Centers for Disease Control and Prevention
                    short_name: CDC
                    parent_id: HHS
                    slug: cdc
                    path: https://dogetrack.info/api/agencies/cdc.json
                  access: []
  /events/{id}.json:
    get:
