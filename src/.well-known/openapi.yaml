              example:
                - id: apex
                  acronym: APEX
                  name: Acquisition Performance and Execution
                  type: internal
                  description: 'A relatively new (~2022) system for tracking procurement at the CDC'
                  comment: null
                  category: obligations
                  population: null
                  risk: null
                  link: null
                  pia: null
                  sorn: null
                  doge_created: false
                  doge_modifications: null
                  projects:
                    - id: spending
                      title: Blocking Grants and Appropriated Funds
