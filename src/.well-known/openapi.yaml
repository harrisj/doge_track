components:
  schemas:
    AccessType:
      description: What type of access was granted to a system
      enum:
        - source-code
        - read
        - read-write
        - admin
        - unknown
    AoType:
      description: The type of the Authorizing Official (AO)
      enum:
        - director
        - deputy
        - cio
        - cto
        - isso
        - other
        - unknown
    CategoryType:
      description: The categories of DOGE people
      enum:
        - booster
        - leadership
        - enabler
        - support
        - wrecker
        - unknown
        - adjacent
        - builder
        - communications
        - immigration
        - obligations
        - other
        - oversight
        - payments
        - personnel
        - scientific
        - security
        - taxes
    TruthType:
      description: Valid values for the precision assessment on dates in positions.
      enum:
        - verified
        - self-reported
        - reported
        - inferred
        - guessed
        - disputed
    EventType:
      description: The type of the event
      enum:
        - action
        - directory
        - sighting
        - disruption
        - interagency
        - legal
        - onboard
        - offboard
        - oversight
        - access
        - official
        - other
        - report
        - website
    PositionType:
      enum:
        - appointed
        - detailed
        - consultant
        - internal
        - converted
        - promotion
        - demotion
        - unknown
    SystemType:
      enum:
        - internal
        - saas
        - ssp
        - unknown
    ExitType:
      enum:
        - fired
        - resigned
        - detail_ended
        - replaced
        - removed
        - unknown
    AffiliationRoleType:
      enum:
        - consultant
        - employee
        - executive
        - investor
        - member
        - ceo
        - founder
        - leader
        - mentor
        - mentee
        - intern
    AffiliationTimeframeType:
      enum:
        - before
        - after
        - during
        - unknown
    AffiliationRecord:
      type: object
      properties:
        id:
          type: string
          description: A unique ID (auto-generated)
        entity_id:
          type: string
          description: The entity associated with this affiliation
        name:
          type: string
          description: The name of a DOGE member in this affiliation
        role:
          $ref: "#/components/schemas/AffiliationRoleType"
        timeframe:
          $ref: "#/components/schemas/AffiliationTimeframeType"
        immediate:
          type: boolean
          description: True if the affiliation was immediately before or affter DOGE
        description:
          type: string
          description: A description of the affiliation
        returned:
          type: boolean
          description: True if returned back to affiliation after time in DOGE
        table_note:
          type: string
          description: A note to display for the affiliation
        start_date:
          $ref: "#/components/schemas/EdtfType"
        start_date_truth:
          $ref: "#/components/schemas/TruthType"
        end_date:
          $ref: "#/components/schemas/EdtfType"
        end_date_truth:
          $ref: "#/components/schemas/TruthType"
        connection_truth:
          $ref: "#/components/schemas/TruthType"
      required:
        - id
        - entity_id
        - name
        - role
        - timeframe
        - connection_truth
    AliasRef:
      type: object
      properties:
        id:
          type: string
        person:
          $ref: "#/components/schemas/PersonRef"
      required:
        - id
    AliasRecord:
      type: object
      properties:
        id:
          description: "The unique ID for the alias"
          type: string
        evidence:
          type: array
          description:
            An array of evidence for the alias identification (each item is a string in
            Markdown format)
          items:
            type: string
        person:
          $ref: "#/components/schemas/PersonRef"
        agency:
          $ref: "#/components/schemas/AgencyRef"
        name_truth:
          type: string
          description: The truth assessment for the alias name, if known
      required:
        - id
        - evidence
        - agency
    AgencyRef:
      type: object
      properties:
        id:
          type: string
          example: USDA
        name:
          type: string
          example: Department of Agriculture
        short_name:
          type: string
          example: Agriculture
        parent_id:
          type: string
        slug:
          type: string
          description: The unique slug for the agency
        path:
          description: The location of the full record for the agency
          type: string
          example: https://dogetrack.info/api/usda.json
      required:
        - id
        - name
        - short_name
        - slug
        - path
    AgencyItem:
      allOf:
        - $ref: "#/components/schemas/AgencyRef"
        - type: object
          properties:
            num_events:
              type: integer
            num_positions:
              type: integer
            num_doge:
              type: integer
          required:
            - num_events
            - num_positions
            - num_doge
    AgencyRecord:
      allOf:
        - $ref: "#/components/schemas/AgencyRef"
        - properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/EventRecord"
            positions:
              type: array
              items:
                $ref: "#/components/schemas/PositionRecord"
            details_from:
              description: Details of staff from this agency to other agencies
              type: array
              items:
                $ref: "#/components/schemas/PositionRecord"
            systems:
              type: array
              items:
                $ref: "#/components/schemas/SystemRecord"
    ApiIndex:
      type: object
      description: An index of the API collections with counts of each collection.
      properties:
        name:
          type: string
          description: The name of the API
        collections:
          type: object
          description: The collections available in the API
          additionalProperties:
            type: object
            properties:
              path:
                type: string
                description: The path to the collection
              count:
                type: integer
                description: The number of items in the collection
    EdtfType:
      type: string
      description: A date in ISO 8601 Extended Date Time Format representation
    EntityRef:
      type: object
      properties:
        id:
          type: string
          description: A unique ID for the entity
        title:
          type: string
          description: A printable title for the entity
        description:
          type: string
          description: A description of the entity
        type:
          $ref: "#/components/schemas/EntityType"
        website:
          type: string
        visible:
          type: boolean
    EntityItem:
      type: object
      allOf:
        - $ref: "#/components/schemas/EntityRef"
        - type: object
          properties:
            path:
              type: string
              description: A path to the record for the entity
    EntityRecord:
      type: object
      allOf:
        - $ref: "#/components/schemas/EntityRef"
        - type: object
          properties:
            affiliations:
              type: array
              items:
                $ref: "#/components/schemas/AffiliationRecord"
    EntityType:
      enum:
        - business
        - personal
        - doge
        - behavior
        - other
    EventRecord:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: "#/components/schemas/EventType"
        date:
          $ref: "#/components/schemas/EdtfType"
        sort_date:
          type: string
          description: A date in ISO 8601 format
        time:
          type: string
          description: The time of day the event occurred, if known
        text:
          type: string
        linkified_text:
          type: string
          description: The event text with internal record links resolved
        notable:
          type: boolean
        fuzz:
          type: string
        comment:
          type: string
        case_no:
          type: string
        system_id:
